<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F8F8F5">
<title>Portal do cliente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --verde:#0F766E; --verde-escuro:#0B5B55; --verde-claro:#D9F0ED;
  --fundo:#F8F8F5; --texto:#171A19; --texto-2:#4B5250; --cinza:#8B9290; --branco:#FFFFFF;
  --linha:rgba(23,26,25,.07); --vermelho:#D93A2B; --ambar:#C27A05;
  --sombra:0 0 0 1px rgba(23,26,25,.045),0 1px 2px rgba(23,26,25,.04);
  --sombra-hover:0 0 0 1px rgba(15,118,110,.10),0 22px 44px -22px rgba(15,118,110,.42),0 6px 14px -8px rgba(23,26,25,.10);
  --mola:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--fundo);color:var(--texto);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(1.6rem,4.5vw,2.2rem);font-weight:600;letter-spacing:-.03em;line-height:1.15}
h2{font-size:1.05rem;font-weight:600;letter-spacing:-.01em}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--verde);outline-offset:2px}
[hidden]{display:none!important}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sub{color:var(--texto-2)}
@keyframes sobe{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
@keyframes esmaece{from{opacity:0}to{opacity:1}}
@keyframes toast{from{opacity:0;transform:translate(-50%,14px) scale(.96)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes desenha{to{stroke-dashoffset:0}}
@keyframes anel{from{transform:scale(.4);opacity:0}60%{transform:scale(1.08);opacity:1}to{transform:scale(1)}}
@keyframes brilho{0%{background-position:-400px 0}100%{background-position:400px 0}}
@keyframes subir{from{transform:translateY(100%)}to{transform:none}}
.entra{animation:sobe .6s var(--mola) both;animation-delay:calc(var(--i,0) * 50ms)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border:none;border-radius:14px;font-weight:600;font-size:.95rem;white-space:nowrap;text-decoration:none;transition:transform .18s var(--mola),background .2s,box-shadow .25s,color .2s}
.btn:active{transform:scale(.96)}
.btn-verde{background:var(--verde);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 10px 22px -12px rgba(15,118,110,.8)}
.btn-verde:hover{background:var(--verde-escuro)}
.btn-claro{background:var(--branco);box-shadow:var(--sombra)}
.btn-claro:hover{color:var(--verde);box-shadow:var(--sombra-hover)}
.btn-fantasma{background:transparent;color:var(--texto-2)}
.btn-fantasma:hover{background:var(--branco);color:var(--verde)}
.btn:disabled{opacity:.6;cursor:wait}
.btn-icone{position:relative;width:42px;height:42px;display:grid;place-items:center;border:none;background:none;border-radius:12px;color:var(--texto-2);transition:background .2s,color .2s}
.btn-icone:hover{background:var(--branco);color:var(--texto)}
.link{color:var(--verde);text-decoration:none;font-size:.88rem;font-weight:500;border:none;background:none;padding:0;cursor:pointer}
.card{position:relative;background:var(--branco);border-radius:20px;box-shadow:var(--sombra)}
.toque{cursor:pointer;transition:transform .45s var(--mola),box-shadow .4s var(--mola)}
.toque:hover{transform:translateY(-3px);box-shadow:var(--sombra-hover)}
.toque:active{transform:scale(.98)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:500;padding:4px 10px;border-radius:99px;background:var(--fundo);color:var(--texto-2);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tom-verde{background:var(--verde-claro);color:var(--verde)}
.tom-ambar{background:#FBF0DA;color:var(--ambar)}
.tom-vermelho{background:#FBE5E2;color:var(--vermelho)}
.avatar{--cor:#0F766E;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none;font-weight:600;font-size:.86rem;background:color-mix(in srgb,var(--cor) 13%,#fff);color:var(--cor)}
.esq{border-radius:18px;background:linear-gradient(90deg,#EEEEEA 0,#F6F6F2 40%,#EEEEEA 80%);background-size:800px 100%;animation:brilho 1.3s linear infinite}

/* Estrutura */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh;overflow-x:clip}
.lateral{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:26px 14px 18px}
.marca{padding:0 12px 24px}
.marca b{display:block;font-size:1.1rem;font-weight:700;letter-spacing:-.01em}
.marca small{display:block;color:var(--cinza);font-size:.76rem;margin-top:2px}
.menu{display:flex;flex-direction:column;gap:2px}
.menu a{display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border-radius:12px;color:var(--texto-2);text-decoration:none;font-weight:500;font-size:.93rem;transition:background .2s,color .2s}
.menu a:hover{color:var(--texto)}
.menu a.ativo{background:var(--branco);color:var(--verde);box-shadow:var(--sombra)}
.menu .qtd{margin-left:auto;min-width:20px;height:20px;padding:0 6px;display:grid;place-items:center;border-radius:99px;background:var(--vermelho);color:#fff;font-size:.7rem;font-weight:700}
.lateral .sair{margin-top:auto}
.principal{min-width:0;padding:0 clamp(16px,4vw,48px) 110px}
.topo{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:10px;padding:16px 0 12px;background:linear-gradient(var(--fundo) 75%,rgba(248,248,245,0))}
.topo .marca-mob{display:none;font-weight:700;font-size:1.02rem}
.topo .dir{margin-left:auto;display:flex;align-items:center;gap:6px}
.sino-n{position:absolute;top:6px;right:5px;min-width:17px;height:17px;padding:0 4px;display:grid;place-items:center;border-radius:99px;background:var(--vermelho);color:#fff;font-size:.64rem;font-weight:700;box-shadow:0 0 0 2px var(--fundo)}
.pagina{max-width:1080px;animation:esmaece .35s ease both}

/* Início */
.saud{padding:10px 0 22px}
.saud p{color:var(--texto-2);margin-top:6px;font-size:1.02rem}
.recado{display:flex;gap:14px;padding:18px 20px;margin-bottom:22px;border-radius:20px;background:var(--verde-claro);color:var(--verde-escuro)}
.recado b{display:block;font-size:.82rem;margin-bottom:2px}
.recado .avatar{background:var(--verde);color:#fff}
.resumo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:34px}
.res{display:flex;flex-direction:column;gap:4px;padding:16px 18px;border-radius:18px;text-decoration:none}
.res .n{font-size:1.9rem;font-weight:600;letter-spacing:-.035em;line-height:1.1}
.res span{font-size:.84rem;color:var(--texto-2)}
.res.destaque{background:var(--texto);color:#fff}
.res.destaque span{color:rgba(255,255,255,.7)}
.sec{margin-bottom:34px}
.sec-cab{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.faixa-ap{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,240px);gap:14px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x mandatory}
.faixa-ap>*{scroll-snap-align:start}
.tudo-ok{display:flex;align-items:center;gap:14px;padding:20px;border-radius:20px}
.tudo-ok .ok{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:14px;background:var(--verde-claro);color:var(--verde)}

/* Cards de conteúdo */
.cc{display:flex;flex-direction:column;overflow:hidden;border-radius:18px;text-decoration:none;color:inherit}
.cc-info{display:flex;flex-direction:column;gap:6px;padding:12px 14px 14px}
.cc-info b{font-size:.92rem;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cc-info small{font-size:.78rem;color:var(--cinza)}
.cc-acao{display:flex;align-items:center;justify-content:center;gap:6px;height:40px;margin-top:4px;border-radius:12px;background:var(--verde);color:#fff;font-weight:600;font-size:.88rem}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.arte{position:relative;display:block;container-type:inline-size;aspect-ratio:4/5;overflow:hidden;background:#ECECE7}
.arte img,.arte video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.arte-gerada{--cor:#0F766E;position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:10cqi 9cqi;color:#fff;overflow:hidden;background:linear-gradient(155deg,color-mix(in srgb,var(--cor) 72%,#fff) 0%,var(--cor) 48%,color-mix(in srgb,var(--cor) 55%,#000) 100%)}
.arte-gerada.v1{background:radial-gradient(120% 90% at 15% 0%,color-mix(in srgb,var(--cor) 55%,#fff),var(--cor) 55%,color-mix(in srgb,var(--cor) 45%,#000))}
.arte-gerada.v2{background:linear-gradient(180deg,color-mix(in srgb,var(--cor) 80%,#fff) 0 55%,color-mix(in srgb,var(--cor) 50%,#000) 55%)}
.arte-gerada::after{content:"";position:absolute;width:78cqi;height:78cqi;right:-26cqi;top:-22cqi;border-radius:50%;background:rgba(255,255,255,.13)}
.ag-cli{position:relative;z-index:1;font-size:max(9px,6.4cqi);font-weight:600;opacity:.88;max-width:62%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-tit{position:relative;z-index:1;font-size:max(13px,11.5cqi);font-weight:700;line-height:1.06;letter-spacing:-.035em;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.arte-fmt{position:absolute;right:8px;top:8px;z-index:3;display:inline-flex;align-items:center;gap:3px;font-size:.68rem;font-weight:600;color:#fff;background:rgba(0,0,0,.34);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:3px 8px;border-radius:99px}
.arte-fmt .i{width:9px;height:9px}
.arte.grande{border-radius:22px;box-shadow:0 34px 70px -34px rgba(23,26,25,.55);width:min(100%,440px);margin:0 auto}
.arte.grande.vertical{aspect-ratio:9/16;width:min(100%,340px)}
.arte.grande .ag-tit{font-size:max(18px,10cqi)}

/* Aprovar */
.voltar{display:inline-flex;align-items:center;gap:6px;padding:4px 0 16px;color:var(--cinza);text-decoration:none;font-size:.9rem}
.voltar:hover{color:var(--texto)}
.ap{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,.9fr);gap:36px;align-items:start}
.ap-midia{position:sticky;top:80px}
.ap-versao{display:inline-block;margin-bottom:10px;padding:4px 12px;border-radius:99px;background:var(--texto);color:#fff;font-size:.76rem;font-weight:600}
.ap-meta{color:var(--cinza);margin-top:6px;font-size:.9rem}
.caixa{margin-top:18px;padding:16px 18px;border-radius:16px;background:var(--branco);box-shadow:var(--sombra)}
.caixa b{display:block;font-size:.8rem;color:var(--cinza);font-weight:600;margin-bottom:4px}
.caixa p{white-space:pre-line;font-size:.94rem}
.caixa.obs{background:var(--verde-claro);box-shadow:none}
.caixa.obs b{color:var(--verde)}
.decidir{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.decidir .btn{height:56px;font-size:1rem}
.decidir .aprovar{grid-column:1/-1;height:60px;font-size:1.08rem}
.btn-alterar{background:var(--branco);color:var(--texto);box-shadow:var(--sombra)}
.btn-alterar:hover{color:var(--vermelho)}
.estado{display:flex;align-items:center;gap:12px;margin-top:22px;padding:16px 18px;border-radius:16px;font-weight:500}
.estado.ok{background:var(--verde-claro);color:var(--verde-escuro)}
.estado.alt{background:#FBE5E2;color:#9E2A1F}
.estado .i{width:24px;height:24px}
.historico{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.historico span{font-size:.76rem;padding:4px 10px;border-radius:99px;background:var(--fundo);color:var(--texto-2)}
.thread{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.bolha{max-width:88%;padding:10px 13px;border-radius:16px;font-size:.9rem;line-height:1.45;animation:sobe .35s var(--mola) both}
.bolha p{white-space:pre-line}
.bolha.cliente{align-self:flex-end;background:var(--verde-claro);border-bottom-right-radius:6px}
.bolha.agencia{align-self:flex-start;background:var(--branco);box-shadow:var(--sombra);border-bottom-left-radius:6px}
.bolha-cab{display:flex;gap:8px;margin-bottom:3px;font-size:.76rem}
.bolha-cab b{font-weight:600}
.bolha-cab small{color:var(--cinza);margin-left:auto}
.t-sistema{align-self:center;max-width:92%;padding:6px 12px;border-radius:99px;font-size:.78rem;background:rgba(23,26,25,.05);color:var(--texto-2);text-align:center}
.t-sistema.ok{background:var(--verde-claro);color:var(--verde)}
.t-sistema.alt{background:#FBE5E2;color:var(--vermelho)}
.form-msg{display:flex;gap:10px;align-items:flex-end;margin-top:14px}
.form-msg textarea{flex:1;min-height:50px;max-height:160px;padding:13px 14px;border:none;border-radius:14px;background:var(--branco);box-shadow:var(--sombra);outline:none;resize:vertical;transition:box-shadow .2s}
.form-msg textarea:focus{box-shadow:0 0 0 1.5px var(--verde),0 0 0 5px rgba(15,118,110,.1)}
.form-msg .btn{height:50px}
.vazio{padding:36px 22px;text-align:center;color:var(--cinza);border-radius:20px;background:var(--branco);box-shadow:var(--sombra)}

/* Sucesso */
.sucesso{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(248,248,245,.8);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:esmaece .25s ease both}
.sucesso>div{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:24px}
.sucesso .circ{width:96px;height:96px;display:grid;place-items:center;border-radius:50%;background:var(--verde);box-shadow:0 20px 50px -18px rgba(15,118,110,.8);animation:anel .6s var(--mola) both}
.sucesso .circ svg{width:48px;height:48px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:desenha .45s .3s var(--mola) forwards}
.sucesso h2{font-size:1.5rem}

/* Segmentado, listas, arquivos */
.segmentado{display:inline-flex;gap:4px;padding:4px;border-radius:13px;background:rgba(23,26,25,.05);margin-bottom:18px;overflow-x:auto;max-width:100%}
.segmentado button{height:36px;padding:0 14px;border:none;border-radius:10px;background:none;font-weight:500;font-size:.87rem;color:var(--texto-2);white-space:nowrap;transition:background .25s,color .25s}
.segmentado button.ativo{background:var(--branco);color:var(--texto);box-shadow:0 1px 3px rgba(23,26,25,.1)}
.linhas{background:var(--branco);border-radius:20px;box-shadow:var(--sombra);overflow:hidden}
.linha{display:flex;align-items:center;gap:14px;padding:15px 18px;text-decoration:none;color:inherit;transition:background .2s}
.linha+.linha{border-top:1px solid var(--linha)}
.linha:hover{background:#FCFCFA}
.linha-tit{flex:1;min-width:0;font-weight:500}
.linha-tit small{display:block;color:var(--cinza);font-weight:400;font-size:.8rem}
.linha-valor{font-weight:600;font-variant-numeric:tabular-nums}
.pastas{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.pasta{display:flex;flex-direction:column;gap:18px;padding:18px;border-radius:18px;border:none;text-align:left}
.pasta .ic{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:var(--verde-claro);color:var(--verde)}
.pasta b{display:block;font-weight:600;font-size:.92rem}
.pasta small{color:var(--cinza);font-size:.8rem}
.arqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.arq{display:flex;flex-direction:column;overflow:hidden;border-radius:18px;border:none;padding:0;text-align:left}
.arq-prev{position:relative;aspect-ratio:16/11;display:grid;place-items:center;background:#F1F1EC;overflow:hidden}
.arq-prev img,.arq-prev video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;user-select:none;-webkit-user-drag:none}
.arq-ic{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:var(--branco);color:var(--verde);box-shadow:var(--sombra)}
.arq-info{padding:12px 14px 14px}
.arq-info b{display:block;font-weight:600;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arq-info small{font-size:.76rem;color:var(--cinza)}
.cadeado{display:inline-flex;align-items:center;gap:4px}
.cadeado .i{width:12px;height:12px}
.enviar-arq{display:flex;align-items:center;justify-content:center;gap:10px;padding:22px;margin-bottom:18px;border:1.5px dashed rgba(23,26,25,.14);border-radius:18px;color:var(--texto-2);cursor:pointer;transition:border-color .2s,background .2s}
.enviar-arq:hover,.enviar-arq.alvo{border-color:var(--verde);background:rgba(15,118,110,.05);color:var(--verde)}
.insights{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.insight{display:flex;flex-direction:column;gap:10px;padding:20px;border-radius:20px}
.insight h3{font-size:1.02rem;font-weight:600;letter-spacing:-.015em}
.insight p{color:var(--texto-2);font-size:.92rem}
.insight small{color:var(--cinza);font-size:.78rem;margin-top:auto}
.dia-grupo{margin-bottom:22px}
.dia-grupo h3{font-size:.86rem;font-weight:600;color:var(--texto-2);margin-bottom:10px}
.ev{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:16px;margin-bottom:8px}
.ev-hora{width:54px;flex:none;font-weight:600;font-variant-numeric:tabular-nums;color:var(--verde)}
.ev b{display:block;font-weight:500}
.ev small{color:var(--cinza);font-size:.8rem}
.chat{display:flex;flex-direction:column;min-height:calc(100vh - 260px)}
.chat .thread{flex:1;margin-bottom:6px}

/* Modal e visualizador */
.modal-fundo{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(23,26,25,.3);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:esmaece .25s ease both}
.modal{width:min(560px,100%);max-height:92vh;overflow:auto;padding:26px 24px calc(24px + env(safe-area-inset-bottom));border-radius:26px 26px 0 0;background:var(--branco);box-shadow:0 -20px 60px -20px rgba(23,26,25,.3);animation:subir .45s var(--mola) both}
.modal h2{font-size:1.3rem;margin-bottom:6px}
.modal textarea{width:100%;min-height:130px;margin-top:14px;padding:14px;border:none;border-radius:14px;background:var(--fundo);outline:none;resize:vertical}
.modal textarea:focus{background:#fff;box-shadow:inset 0 0 0 1.5px var(--verde),0 0 0 5px rgba(15,118,110,.1)}
.modal-rodape{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.modal-rodape .btn{flex:1}
.visor{width:min(900px,100%);padding:18px}
.visor-midia{display:grid;place-items:center;min-height:200px;border-radius:18px;background:#F1F1EC;overflow:hidden}
.visor-midia img,.visor-midia video{max-width:100%;max-height:62vh;display:block;user-select:none;-webkit-user-drag:none}
.visor-rod{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}
.visor-rod b{flex:1;min-width:0}
.aviso-bloq{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;color:var(--cinza)}
@media (min-width:700px){.modal-fundo{align-items:center;padding:24px}.modal{border-radius:26px;animation:pop .35s var(--mola) both}}

/* Toast e notificações */

      q(sb.from('pastas').select('*').eq('cliente_id', cid).order('ordem')),
      q(sb.from('arquivos').select('*').eq('cliente_id', cid).order('criado_em', { ascending:false }).limit(300)),
      q(sb.from('insights').select('*').eq('cliente_id', cid).order('criado_em', { ascending:false }).limit(50)),
      q(sb.from('eventos').select('*').eq('cliente_id', cid).gte('inicio', dia(-1)).order('inicio').limit(50)),
      q(sb.from('pagamentos').select('*').eq('cliente_id', cid).eq('tipo', 'receita').order('vencimento', { ascending:false }).limit(24)),
      q(sb.from('notificacoes').select('*').eq('user_id', uid).order('criado_em', { ascending:false }).limit(30))
    ]);
    const paths = [...new Set([...conteudos, ...versoes].map(x => x.midia_path).concat(arquivos.filter(a => /^(image|video)\//.test(a.tipo || '')).map(a => a.storage_path)).filter(Boolean))];
    if (paths.length){
      const assin = await q(sb.storage.from('arquivos').createSignedUrls(paths, 3600));
      assin.forEach(x => { if (x.signedUrl) midias[x.path] = x.signedUrl; });
    }
    return { org:m.organizacoes, membro:m, cliente, conteudos, versoes, decisoes, comentarios, pastas, arquivos, insights, eventos, pagamentos, notificacoes };
  },
  async decidir(k, v, decisao, mensagem){
    const [d] = await q(sb.from('aprovacoes').insert({ org_id:state.d.org.id, conteudo_id:k.id, versao_id:v?.id || null, decisao, mensagem:mensagem || null, user_id:state.user.id }).select());
    return d;
  },
  async comentar(conteudoId, texto){
    const [m] = await q(sb.from('comentarios').insert({ org_id:state.d.org.id, cliente_id:state.d.cliente.id, conteudo_id:conteudoId, texto, interno:false, do_cliente:true, autor_id:state.user.id, autor_nome:state.d.membro?.nome || state.d.cliente.nome }).select());
    return m;
  },
  async enviarArquivo(file, pastaId){
    const ext = (file.name.split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g, '');
    const path = `${state.d.org.id}/${state.d.cliente.id}/cliente/${novoId()}.${ext}`;
    const { error } = await sb.storage.from('arquivos').upload(path, file, { contentType:file.type || 'application/octet-stream' });
    if (error) throw error;
    const [a] = await q(sb.from('arquivos').insert({ org_id:state.d.org.id, cliente_id:state.d.cliente.id, pasta_id:pastaId, nome:file.name, tipo:file.type || null, tamanho:file.size, storage_path:path, enviado_pelo_cliente:true, visivel_cliente:false, pode_baixar:false, enviado_por:state.user.id }).select());
    return a;
  },
  async linkArquivo(a, baixar){
    if (!a.storage_path) return a.link_url || null;
    const { data, error } = await sb.storage.from('arquivos').createSignedUrl(a.storage_path, 300, baixar ? { download:a.nome } : undefined);
    if (error) throw error; return data.signedUrl;
  },
  async lerNotif(id){ await q(sb.from('notificacoes').update({ lida:true }).eq('id', id)); }
};

const state = { tela:'carregando', user:null, d:null, modoLogin:'entrar', erro:'', filtroCont:'todos', pastaAberta:null, canal:null };

async function iniciar(){
  if (MODO_DEMO){ state.tela = 'login'; render(); return; }
  const { data:{ session } } = await sb.auth.getSession();
  await aoSessao(session);
  sb.auth.onAuthStateChange((_e, s) => { if ((s?.user?.id || null) !== (state.user?.id || null)) aoSessao(s); });
}
async function aoSessao(s){
  state.user = s?.user || null;
  if (!state.user){ state.tela = 'login'; render(); return; }
  await carregar();
}
async function carregar(){
  try {
    state.d = await api.carregar();
    state.tela = state.d ? 'app' : 'sem-acesso';
    if (state.d && !MODO_DEMO && !state.canal){
      state.canal = sb.channel('pn-' + state.user.id).on('postgres_changes', { event:'INSERT', schema:'public', table:'notificacoes', filter:`user_id=eq.${state.user.id}` }, async p => {
        avisar(p.new.titulo);
        state.d = await api.carregar().catch(() => state.d);
        render();
      }).subscribe();
    }
  } catch (e){ state.tela = 'login'; state.erro = msgErro(e); }
  render();
}
async function sair(){
  if (!MODO_DEMO){ if (state.canal) sb.removeChannel(state.canal); state.canal = null; await sb.auth.signOut(); }
  Object.assign(state, { tela:'login', user:null, d:null, erro:'' });
  demo = criarDemo();
  history.replaceState(null, '', location.pathname);
  render();
}
const rota = () => { const p = (location.hash.replace(/^#\/?/, '') || 'inicio').split('/'); return { pagina:p[0] || 'inicio', id:p[1] }; };

function arteHTML(k, grande = false){
  const v = versaoAtual(k);
  const fonte = v && (v.midia_path || v.midia_url) ? v : k;
  const url = urlDe(fonte), tipo = fonte.midia_tipo || k.midia_tipo;
  const fmt = k.formato || 'Post', vertical = ['Reels','Stories','Vídeo'].includes(fmt);
  const cor = state.d.cliente.cor || '#0F766E';
  let midia;
  if (url && tipo === 'video') midia = `<video src="${esc(url)}#t=0.1" ${grande ? 'controls' : 'muted'} playsinline preload="metadata"></video>`;
  else if (url) midia = `<img src="${esc(url)}" alt="${esc(k.titulo)}" loading="lazy">`;
  else midia = `<span class="arte-gerada v${(k.numero || 0) % 3}" style="--cor:${esc(cor)}"><span class="ag-cli">${esc(state.d.cliente.nome)}</span><span class="ag-tit">${esc(v?.titulo || k.titulo)}</span></span>`;
  return `<span class="arte ${grande ? 'grande' : ''} ${grande && vertical ? 'vertical' : ''}">${midia}<span class="arte-fmt">${vertical ? icone('play') : ''}${esc(fmt)}</span></span>`;

function cardConteudo(k, i, comAcao){
  return `<a class="card cc toque entra" style="--i:${Math.min(i, 12)}" href="#/aprovar/${esc(k.id)}">

function thread(conteudoId){
  const cs = state.d.comentarios.filter(c => (c.conteudo_id || null) === conteudoId && !c.interno).map(c => ({ ...c, _t:'c' }));
  const ds = conteudoId ? state.d.decisoes.filter(d => d.conteudo_id === conteudoId).map(d => ({ ...d, _t:'d' })) : [];
  const itens = [...cs, ...ds].sort((a, b) => String(a.criado_em).localeCompare(String(b.criado_em)));
  if (!itens.length) return `<p class="sub" style="font-size:.9rem">${conteudoId ? 'Nenhum comentário ainda. Ficou alguma dúvida? Escreva abaixo.' : 'Nenhuma mensagem ainda. Escreva para a agência quando quiser.'}</p>`;
  return itens.map(x => x._t === 'd'
    ? `<div class="t-sistema ${x.decisao === 'aprovado' ? 'ok' : 'alt'}">${x.decisao === 'aprovado' ? 'Você aprovou' : 'Você pediu alteração'}${x.mensagem ? `: “${esc(x.mensagem)}”` : ''}, ${quando(x.criado_em)}</div>`
    : `<div class="bolha ${x.do_cliente ? 'cliente' : 'agencia'}"><div class="bolha-cab"><b>${x.do_cliente ? 'Você' : esc(x.autor_nome || 'Agência')}</b><small>${quando(x.criado_em)}</small></div><p>${esc(x.texto)}</p></div>`).join('');
}

    return `<h1 class="entra" style="margin:8px 0 18px">Arquivos</h1>
      <label class="enviar-arq entra" id="enviar-arq">${icone('enviar')}<span>Enviar arquivos para a agência</span><input type="file" id="inp-arq" multiple hidden></label>
      <div class="pastas">${comArq.map((p, i) => { const n = vis.filter(a => a.pasta_id === p.id).length; return `<button class="card pasta toque entra" style="--i:${i}" data-acao="abrir-pasta" data-id="${esc(p.id)}"><span class="ic">${icone('arquivos')}</span><span><b>${p.id === pastaCliente?.id ? 'Enviados por você' : esc(p.nome)}</b><small>${n ? `${n} ${n === 1 ? 'arquivo' : 'arquivos'}` : 'Vazia'}</small></span></button>`; }).join('')}</div>`;
  }
  const lista = vis.filter(a => a.pasta_id === pasta.id);
  return `<button class="voltar" data-acao="fechar-pasta" style="border:none;background:none;cursor:pointer">${icone('voltar')}Arquivos</button>
    <h1 class="entra" style="margin-bottom:18px">${pasta.id === pastaCliente?.id ? 'Enviados por você' : esc(pasta.nome)}</h1>
    ${lista.length ? `<div class="arqs">${lista.map((a, i) => {
      const url = urlDe(a), img = url && /^image\//.test(a.tipo || ''), vid = url && /^video\//.test(a.tipo || '');
      return `<button class="card arq toque entra" style="--i:${i}" data-acao="ver-arquivo" data-id="${esc(a.id)}">
        <span class="arq-prev">${img ? `<img src="${esc(url)}" alt="" draggable="false">` : vid ? `<video src="${esc(url)}#t=0.1" muted preload="metadata"></video>` : `<span class="arq-ic">${icone(a.link_url && !a.tipo ? 'link' : 'doc')}</span>`}</span>
        <span class="arq-info"><b>${esc(a.nome)}</b><small>${a.enviado_pelo_cliente ? 'Enviado por você' : a.pode_baixar ? 'Download liberado' : `<span class="cadeado">${icone('cadeado')}Só visualização</span>`}, ${quando(a.criado_em)}</small></span>
      </button>`; }).join('')}</div>` : '<div class="vazio">Nenhum arquivo nesta pasta.</div>'}`;
}

function telaInsights(){
  const l = state.d.insights;
  return `<h1 class="entra" style="margin:8px 0 6px">Insights</h1><p class="sub entra" style="margin-bottom:22px">O que a agência descobriu sobre o seu público e seus resultados.</p>
    ${l.length ? `<div class="insights">${l.map((x, i) => `<article class="card insight entra" style="--i:${i}"><span class="pill tom-verde" style="align-self:flex-start">${{ conteudo:'Conteúdo', publico:'Público', estrategico:'Estratégia', geral:'Geral' }[x.categoria] || 'Insight'}</span><h3>${esc(x.titulo)}</h3>${x.descricao ? `<p>${esc(x.descricao)}</p>` : ''}<small>${esc(x.autor_nome || '')}, ${quando(x.criado_em)}</small></article>`).join('')}</div>` : '<div class="vazio">Nenhum insight publicado ainda.</div>'}`;
}

function telaMensagens(){
  return `<div class="chat"><h1 class="entra" style="margin:8px 0 6px">Mensagens</h1><p class="sub" style="margin-bottom:18px">Fale com a agência por aqui. Você recebe um aviso quando responderem.</p>
    <div class="thread" id="thread">${thread(null)}</div>
    <form class="form-msg" id="form-coment" data-conteudo=""><textarea name="texto" rows="1" required placeholder="Escreva sua mensagem"></textarea><button class="btn btn-verde" type="submit">Enviar</button></form></div>`;
}

function telaAgenda(){
  const itens = [
    ...state.d.eventos.filter(e => diffDias(e.inicio) >= 0).map(e => ({ data:isoDia(paraData(e.inicio)), hora:hora(e.inicio), titulo:e.titulo, sub:e.fim ? `até ${hora(e.fim)}` : 'Compromisso' })),
    ...state.d.conteudos.filter(k => k.data_publicacao && diffDias(k.data_publicacao) >= 0 && ['aguardando_cliente','aprovado','publicado'].includes(k.status)).map(k => ({ data:k.data_publicacao, hora:'Post', titulo:k.titulo, sub:k.formato, link:`#/aprovar/${k.id}` }))
  ].sort((a, b) => (a.data + a.hora).localeCompare(b.data + b.hora));
  const grupos = {}; itens.forEach(x => (grupos[x.data] ||= []).push(x));
  return `<h1 class="entra" style="margin:8px 0 22px">Agenda</h1>
    ${itens.length ? Object.entries(grupos).map(([d, l], gi) => `<div class="dia-grupo entra" style="--i:${gi}"><h3>${rotuloDia(d)}, ${dataCurta(d)}</h3>${l.map(x => `<${x.link ? `a href="${x.link}"` : 'div'} class="card ev ${x.link ? 'toque' : ''}" style="text-decoration:none"><span class="ev-hora">${esc(x.hora)}</span><span><b>${esc(x.titulo)}</b><small>${esc(x.sub || '')}</small></span></${x.link ? 'a' : 'div'}>`).join('')}</div>`).join('') : '<div class="vazio">Nenhum compromisso marcado.</div>'}`;
}

function telaFinanceiro(){
  const l = [...state.d.pagamentos].sort((a, b) => b.vencimento.localeCompare(a.vencimento));
  const aberto = l.filter(p => p.status === 'pendente');
  const total = aberto.reduce((s, p) => s + Number(p.valor), 0);
  return `<h1 class="entra" style="margin:8px 0 18px">Financeiro</h1>
    <div class="resumo" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">
      <div class="card res entra ${total ? 'destaque' : ''}"><span class="n">${moeda(total)}</span><span>Em aberto</span></div>
      ${aberto[0] ? `<div class="card res entra" style="--i:1"><span class="n">${dataCurta(aberto.sort((a, b) => a.vencimento.localeCompare(b.vencimento))[0].vencimento)}</span><span>Próximo vencimento</span></div>` : ''}
    </div>
    ${l.length ? `<div class="linhas">${l.map(p => { const atr = p.status === 'pendente' && diffDias(p.vencimento) < 0; return `<div class="linha"><div class="linha-tit">${esc(p.servico || 'Mensalidade')}<small>Vencimento ${dataCurta(p.vencimento)}</small></div><span class="pill ${p.status === 'recebido' ? 'tom-verde' : atr ? 'tom-vermelho' : 'tom-ambar'}">${p.status === 'recebido' ? 'Pago' : atr ? 'Atrasado' : 'Em aberto'}</span><span class="linha-valor">${moeda(p.valor)}</span></div>`; }).join('')}</div>` : '<div class="vazio">Nenhum lançamento.</div>'}`;
}

/* =====================================================================
   AÇÕES
   ===================================================================== */
async function decidir(k, decisao, mensagem){
  const v = versaoAtual(k);
  const d = await api.decidir(k, v, decisao, mensagem);
  k.status = decisao === 'aprovado' ? 'aprovado' : 'alteracao_solicitada';
  if (v) v.status = decisao === 'aprovado' ? 'aprovada' : 'alteracao_solicitada';
  state.d.decisoes.push(d);
}
function comemorar(titulo, texto, depois){
  const el = document.createElement('div');
  el.className = 'sucesso'; el.setAttribute('role', 'status');
  el.innerHTML = `<div><span class="circ"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span><h2>${esc(titulo)}</h2><p class="sub">${esc(texto)}</p></div>`;
  document.body.appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => { el.remove(); depois?.(); }, 300); }, 1600);
}
function modal(html){ document.getElementById('modal').innerHTML = `<div class="modal-fundo" data-acao="fechar-modal-fundo">${html}</div>`; setTimeout(() => document.querySelector('#modal textarea, #modal button')?.focus(), 50); }
const fecharModal = () => { document.getElementById('modal').innerHTML = ''; };

async function verArquivo(a){
  const url = urlDe(a) || await api.linkArquivo(a, false).catch(() => null);
  const img = url && /^image\//.test(a.tipo || ''), vid = url && /^video\//.test(a.tipo || '');
  const pode = a.pode_baixar || a.enviado_pelo_cliente;
  modal(`<div class="modal visor" role="dialog" aria-modal="true" aria-label="${esc(a.nome)}">
    <div class="visor-midia" ${pode ? '' : 'oncontextmenu="return false"'}>${img ? `<img src="${esc(url)}" alt="${esc(a.nome)}" draggable="false">` : vid ? `<video src="${esc(url)}" controls ${pode ? '' : 'controlsList="nodownload"'} playsinline></video>` : `<div style="padding:40px;text-align:center"><span class="arq-ic" style="margin:0 auto 12px">${icone('doc')}</span><p class="sub">${url ? 'Abra para visualizar.' : 'Visualização indisponível no modo demonstração.'}</p></div>`}</div>
    <div class="visor-rod"><b>${esc(a.nome)}</b>
      ${!img && !vid && url && pode ? `<a class="btn btn-claro" href="${esc(url)}" target="_blank" rel="noopener">Abrir</a>` : ''}
      ${pode ? `<button class="btn btn-verde" data-acao="baixar" data-id="${esc(a.id)}">${icone('baixar')}Baixar</button>` : `<span class="aviso-bloq">${icone('cadeado')}Download não liberado pela agência</span>`}
      <button class="btn btn-fantasma" data-acao="fechar-modal">Fechar</button></div>
  </div>`);
}
async function baixar(a){
  try {
    const url = await api.linkArquivo(a, true);
    if (!url){ avisar('No modo demonstração este arquivo não tem conteúdo.'); return; }
    const l = document.createElement('a'); l.href = url; l.download = a.nome; document.body.appendChild(l); l.click(); l.remove();
  } catch (e){ avisar(msgErro(e)); }
}
async function enviarArquivos(files){
  const pasta = state.d.pastas.find(p => /enviados pelo cliente/i.test(p.nome));
  if (!pasta){ avisar('A pasta de envios não foi encontrada. Avise a agência.'); return; }
  let n = 0;
  for (const f of files){
    if (f.size > 50 * 1024 * 1024){ avisar(`${f.name} passa de 50 MB.`); continue; }
    try { const a = await api.enviarArquivo(f, pasta.id); state.d.arquivos.unshift(a); n++; } catch (e){ avisar(msgErro(e)); }
  }
  if (n){ state.pastaAberta = pasta.id; render(); avisar(`${n} ${n === 1 ? 'arquivo enviado' : 'arquivos enviados'}. A agência já foi avisada.`); }
}

/* =====================================================================
   EVENTOS
   ===================================================================== */
document.addEventListener('click', async e => {
  if (!e.target.closest('#pop-notif, [data-acao="notificacoes"]')){ const p = document.getElementById('pop-notif'); if (p) p.innerHTML = ''; }
  const el = e.target.closest('[data-acao]'); if (!el) return;
  const a = el.dataset.acao, id = el.dataset.id;
  if (a === 'fechar-modal-fundo' && e.target !== el) return;
  const k = id ? state.d?.conteudos.find(x => x.id === id) : null;
  switch (a){
    case 'entrar-demo': state.d = await api.carregar(); state.tela = 'app'; render(); break;
    case 'trocar-login': state.modoLogin = state.modoLogin === 'entrar' ? 'criar' : 'entrar'; state.erro = ''; render(); break;
    case 'sair': sair(); break;
    case 'fechar-modal': case 'fechar-modal-fundo': fecharModal(); break;
    case 'aprovar':
      if (!k) break;
      el.disabled = true;
      try { await decidir(k, 'aprovado'); comemorar('Aprovado!', 'A agência já foi avisada.', () => { location.hash = pendentes().length ? '#/aprovacoes' : '#/inicio'; render(); }); }
      catch (err){ el.disabled = false; avisar(msgErro(err)); }
      break;
    case 'alterar':
      modal(`<form class="modal" id="form-alterar" data-id="${esc(id)}" role="dialog" aria-modal="true" aria-labelledby="mt">
        <h2 id="mt">O que você gostaria de alterar?</h2><p class="sub">Explique do seu jeito. A agência recebe na hora.</p>
        <textarea name="mensagem" required placeholder="Ex.: Podemos trocar a foto da capa?"></textarea>
        <div class="modal-rodape"><button type="button" class="btn btn-fantasma" data-acao="fechar-modal">Cancelar</button><button type="submit" class="btn btn-verde">Enviar solicitação</button></div>
      </form>`);
      break;
    case 'comentar': document.getElementById('txt-coment')?.focus(); document.getElementById('form-coment')?.scrollIntoView({ behavior:'smooth', block:'center' }); break;
    case 'filtro-cont': state.filtroCont = el.dataset.valor; render(); break;
    case 'abrir-pasta': state.pastaAberta = id; render(); window.scrollTo(0, 0); break;
    case 'fechar-pasta': state.pastaAberta = null; render(); break;
    case 'ver-arquivo': { const x = state.d.arquivos.find(i => i.id === id); if (x) verArquivo(x); break; }
    case 'baixar': { const x = state.d.arquivos.find(i => i.id === id); if (x) baixar(x); break; }
    case 'notificacoes': {
      const alvo = document.getElementById('pop-notif');
      if (alvo.innerHTML){ alvo.innerHTML = ''; break; }
      const l = state.d.notificacoes;
      alvo.innerHTML = `<div class="pop-notif" role="menu">${l.length ? l.map(n => `<button class="pn-item ${n.lida ? '' : 'nova'}" data-acao="abrir-notif" data-id="${esc(n.id)}" role="menuitem"><i></i><span><b>${esc(n.titulo)}</b>${n.texto ? `<small>${esc(n.texto)}</small>` : ''}<em>${quando(n.criado_em)}</em></span></button>`).join('') : '<p class="sub" style="padding:16px">Nenhuma notificação.</p>'}</div>`;
      break;
    }
    case 'abrir-notif': {
      const n = state.d.notificacoes.find(x => x.id === id);
      if (n && !n.lida){ n.lida = true; api.lerNotif(id).catch(() => {}); }
      if (n?.link){ if (location.hash === n.link) render(); else location.hash = n.link; } else render();
      break;
    }
    case 'mais':
      modal(`<div class="modal folha" role="dialog" aria-modal="true" aria-label="Mais opções">
        ${[['conteudos','Conteúdos','conteudos'],['insights','Insights','insights'],['agenda','Agenda','agenda'],['financeiro','Financeiro','financeiro']].map(([k, l, ic]) => `<a href="#/${k}" data-acao="fechar-modal">${icone(ic)}${l}</a>`).join('')}
        <button data-acao="sair">${icone('sair')}Sair</button>
      </div>`);
      break;
  }
});
document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, b = f.querySelector('[type=submit]');
  if (f.id === 'form-login'){
    const d = Object.fromEntries(new FormData(f)); b.disabled = true; state.erro = '';
    try {
      if (state.modoLogin === 'entrar'){ const { error } = await sb.auth.signInWithPassword({ email:d.email.trim(), password:d.senha }); if (error) throw new Error('E-mail ou senha incorretos.'); }
      else {
        const { data, error } = await sb.auth.signUp({ email:d.email.trim(), password:d.senha });
        if (error) throw error;
        if (!data.session){ state.modoLogin = 'entrar'; render(); avisar('Enviamos um link de confirmação para o seu e-mail.'); return; }
      }
    } catch (err){ state.erro = msgErro(err); render(); }
    return;
  }
  if (f.id === 'form-alterar'){
    const k = state.d.conteudos.find(x => x.id === f.dataset.id); const msg = f.mensagem.value.trim(); if (!k || !msg) return;
    b.disabled = true;
    try { await decidir(k, 'alteracao_solicitada', msg); fecharModal(); comemorar('Pedido enviado', 'A agência vai ajustar e te mandar uma nova versão.', () => render()); }
    catch (err){ b.disabled = false; avisar(msgErro(err)); }
    return;
  }
  if (f.id === 'form-coment'){
    const texto = f.texto.value.trim(); if (!texto) return;
    b.disabled = true;
    try {
      const m = await api.comentar(f.dataset.conteudo || null, texto);
      state.d.comentarios.push(m);
      document.getElementById('thread').innerHTML = thread(f.dataset.conteudo || null);
      f.texto.value = '';
      avisar(f.dataset.conteudo ? 'Comentário enviado.' : 'Mensagem enviada.');
    } catch (err){ avisar(msgErro(err)); }
    b.disabled = false;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') fecharModal();
  if (e.key === 'Enter' && !e.shiftKey && e.target.matches?.('#form-coment textarea') && window.innerWidth > 900){ e.preventDefault(); e.target.form.requestSubmit(); }
});
document.addEventListener('change', e => { if (e.target.id === 'inp-arq' && e.target.files.length) enviarArquivos([...e.target.files]); });
document.addEventListener('dragover', e => { const z = e.target.closest?.('#enviar-arq'); if (z){ e.preventDefault(); z.classList.add('alvo'); } });
document.addEventListener('dragleave', e => { const z = e.target.closest?.('#enviar-arq'); if (z && !z.contains(e.relatedTarget)) z.classList.remove('alvo'); });
document.addEventListener('drop', e => { const z = e.target.closest?.('#enviar-arq'); if (z && e.dataTransfer.files.length){ e.preventDefault(); z.classList.remove('alvo'); enviarArquivos([...e.dataTransfer.files]); } });
window.addEventListener('hashchange', () => { if (state.tela === 'app'){ if (rota().pagina !== 'arquivos') state.pastaAberta = null; fecharModal(); render(); window.scrollTo(0, 0); } });

iniciar();
</script>
</body>
</html>
