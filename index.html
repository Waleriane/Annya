document.addEventListener('click', async e => {
  // Agenda: clicar num horário livre cria um evento naquele horário
  const col = e.target.closest('.tg-col');
  if (col && e.target === col){
    const r = col.getBoundingClientRect(), hh = Number(col.dataset.hh);
    const min = AG_INI * 60 + Math.floor(((e.clientY - r.top) / hh * 60) / 30) * 30;
    modalEvento(null, { dia:col.dataset.dia, hora:`${pad(Math.floor(min / 60))}:${pad(min % 60)}` });
    return;
  }
  if (!e.target.closest('button, a, input, select, label')){
    const lanc = e.target.closest('[data-lanc]');
    if (lanc){ const p = acharLanc(lanc.dataset.lanc); if (p) modalLanc(p); return; }
    const linhaEnt = e.target.closest('[data-ent]');
    if (linhaEnt){
      const id = linhaEnt.dataset.id;
      if (linhaEnt.dataset.ent === 'conteudo'){ const k = ent.dados.conts.find(x => x.id === id); if (k) abrirGaveta(k); }
      if (linhaEnt.dataset.ent === 'projeto'){ const p = ent.dados.projs.find(x => x.id === id); if (p) modalProjeto(p); }
      return;
    }
    const card = e.target.closest('[data-bib]');
    if (card){ const x = bib.itens.find(i => i.id === card.dataset.bib); if (x) modalBib(x); return; }
  }
  const el = e.target.closest('[data-acao]'); if (!el) return;
  const a = el.dataset.acao, ctx = el.dataset.ctx;
  switch (a){
    case 'ss-dia': e.preventDefault(); cont.ref = el.dataset.dia; cont.visao = 'semana'; location.hash = '#/conteudos'; break;
    case 'periodo':
      if (ctx === 'fin'){ fin.ref = moverRef(fin.ref, 'mes', Number(el.dataset.dir)); await carregarFinanceiro().catch(err => avisar(msgErro(err))); renderFinanceiro(); }
      break;
    case 'visao':
      if (ctx === 'ent'){ ent.tipo = el.dataset.valor; trocarSegmento('ent', ent.tipo); renderEntregas(); }
      if (ctx === 'bib'){ bib.aba = el.dataset.valor; trocarSegmento('bib', bib.aba); renderBiblioteca(); }
      if (ctx === 'fin'){ fin.aba = el.dataset.valor; trocarSegmento('fin', fin.aba); document.getElementById('fin-lista').innerHTML = htmlListaFin(); }
      break;
    case 'filtro-cli': if (ctx === 'ent'){ ent.cliente = el.dataset.valor; renderEntregas(); } break;
    case 'novo-lanc': modalLanc(null, { cliente:el.dataset.cliente }); break;
    case 'baixar': e.stopPropagation(); baixar(el.dataset.id, el); break;
    case 'gerar-mensalidades': gerarMensalidades(); break;
    case 'excluir-lanc': excluirLanc(); break;
    case 'concluir-tarefa': e.stopPropagation(); concluirTarefa(el.dataset.id, el); break;
    case 'novo-bib': modalBib(null); break;
    case 'excluir-bib': excluirBib(); break;
    case 'copiar-bib': e.stopPropagation(); copiarBib(el.dataset.id); break;
    case 'aplicar-bib': { e.stopPropagation(); const x = bib.itens.find(i => i.id === el.dataset.id); if (x) modalAplicar(x); break; }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches?.('[data-lanc],[data-ent],[data-bib]')){ e.preventDefault(); e.target.click(); }
});
document.addEventListener('change', e => {
  if (e.target.closest?.('#form-lanc') && e.target.name === 'tipo') ajustarTipoLanc();
  if (e.target.closest?.('#form-bib') && e.target.name === 'tipo') ajustarTipoBib();
});
document.addEventListener('input', e => {
  if (e.target.id === 'bib-busca'){ bib.busca = e.target.value; renderBiblioteca(); }
});
document.addEventListener('submit', e => {
  const id = e.target.id;
  if (id === 'form-lanc') salvarLanc(e.target);
  if (id === 'form-bib') salvarBib(e.target);
  if (id === 'form-aplicar') aplicarProcesso(e.target);
});

function htmlThread(comentarios, decisoes){

      const files = state.soltosModal || [...document.getElementById('ar-file').files];
      if (!files.length){ avisar('Escolha pelo menos um arquivo.'); b.disabled = false; return; }
      for (let i = 0; i < files.length; i++){
        const f = files[i];
        if (f.size > 50 * 1024 * 1024){ avisar(`${f.name} passa de 50 MB e ficou de fora.`); continue; }
        b.textContent = `Enviando ${i + 1} de ${files.length}…`;
        const up = await api.enviarArquivo(f, c.id);
        novos.push(await api.insert('arquivos', { ...base, ...up, nome:f.name, tipo:f.type || null, tamanho:f.size }));
      }
    }
    state.cli.arquivos = [...novos, ...(state.cli.arquivos || [])];
    await resolverArquivos(novos).catch(() => {});
    fecharModal();
    if (state.cli.aba !== 'arquivos') location.hash = `#/cliente/${c.id}/arquivos`; else renderAbaAtual();
    avisar(`${novos.length} ${novos.length === 1 ? 'arquivo enviado' : 'arquivos enviados'}${base.visivel_cliente ? '. O cliente já pode ver no portal.' : '.'}`);
  } catch (e){ avisar(msgErro(e)); b.disabled = false; b.textContent = 'Enviar'; }
}

const notif = { itens:[], canal:null };
async function iniciarNotificacoes(){

    notif.canal = sb.channel('notif-' + state.user.id)
      .on('postgres_changes', { event:'INSERT', schema:'public', table:'notificacoes', filter:`user_id=eq.${state.user.id}` }, p => {
        notif.itens.unshift(p.new); atualizarSino(true); avisar(p.new.titulo);

    case 'copiar-usuario': { const x = state.cli.credenciais.find(i => i.id === id); if (x) copiarTexto(x.usuario, 'Usuário copiado.'); break; }
    case 'mensagens': if (state.cli) abrirMensagens(); break;
    case 'portal-cliente': if (state.cli) modalPortal(); break;
    case 'copiar-portal': copiarTexto(urlPortal(), 'Endereço do portal copiado.'); break;
  }
});
document.addEventListener('change', e => {
  if (e.target.matches?.('[data-perm]')) mudarPermissao(e.target);
  if (e.target.closest?.('#form-arquivo') && e.target.name === 'modo'){
    const m = e.target.value;
    document.querySelectorAll('#form-arquivo [data-modo]').forEach(x => x.hidden = x.dataset.modo !== m);
  }
  if (e.target.id === 'ar-file'){ state.soltosModal = null; const n = e.target.files.length; document.getElementById('ar-nomes').textContent = n ? `${n} ${n === 1 ? 'arquivo escolhido' : 'arquivos escolhidos'}: ${[...e.target.files].map(f => f.name).join(', ')}` : 'Clique ou arraste os arquivos aqui'; }
});
document.addEventListener('submit', e => {
  const id = e.target.id;
  if (id === 'form-arquivo') enviarArquivos(e.target);
  if (id === 'form-acesso') salvarAcesso(e.target);
  if (id === 'form-chat') enviarChat(e.target);
  if (id === 'form-portal') salvarPortal(e.target);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && e.target.matches?.('#form-chat textarea')){ e.preventDefault(); e.target.form.requestSubmit(); }
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.target.id === 'gav-coment'){ e.preventDefault(); comentarConteudo(); }
});
/* Arrastar arquivos do computador para a pasta aberta ou para a janela de envio */
document.addEventListener('dragover', e => {
  const z = e.target.closest?.('#soltar-arq, #soltar-modal');
  if (z && [...(e.dataTransfer?.types || [])].includes('Files')){ e.preventDefault(); z.classList.add('alvo'); }
});
document.addEventListener('dragleave', e => { const z = e.target.closest?.('#soltar-arq, #soltar-modal'); if (z && !z.contains(e.relatedTarget)) z.classList.remove('alvo'); });
document.addEventListener('drop', e => {
  const z = e.target.closest?.('#soltar-arq, #soltar-modal');
  if (!z || !e.dataTransfer?.files?.length) return;
  e.preventDefault(); z.classList.remove('alvo');
  if (z.id === 'soltar-arq') enviarSoltosNaPasta(z.dataset.pasta, [...e.dataTransfer.files]);
  else { state.soltosModal = [...e.dataTransfer.files]; document.getElementById('ar-nomes').textContent = `${state.soltosModal.length} ${state.soltosModal.length === 1 ? 'arquivo' : 'arquivos'}: ${state.soltosModal.map(f => f.name).join(', ')}`; }
});

iniciar();
</script>
</body>
</html>
