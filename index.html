function comparar(a, b){
  if (typeof a === 'number' && typeof b === 'number') return a - b;
  return String(a ?? '').localeCompare(String(b ?? ''), 'pt-BR');
}
const apiDemo = {
  async list(t, f = {}){
    let r = [...(demo[t] || [])];
    for (const [k, v] of Object.entries(f.eq || {}))  r = r.filter(x => x[k] === v);
    for (const [k, v] of Object.entries(f.in || {}))  r = r.filter(x => v.includes(x[k]));
    for (const [k, v] of Object.entries(f.gte || {})) r = r.filter(x => x[k] != null && String(x[k]) >= v);
    for (const [k, v] of Object.entries(f.lte || {})) r = r.filter(x => x[k] != null && String(x[k]) <= v);
    for (const k of (f.nulo || [])) r = r.filter(x => x[k] == null);
    if (f.order) r.sort((a, b) => comparar(a[f.order], b[f.order]) * (f.desc ? -1 : 1));
    if (f.limit) r = r.slice(0, f.limit);
    return r.map(x => ({ ...x }));
  },
  async insert(t, obj){
    const novo = { ...obj, id:novoId(), criado_em:new Date().toISOString() };
    demo[t].push(novo);
    if (t === 'clientes'){  // o banco real faz isso sozinho (automação)
      ONBOARDING.forEach((titulo, i) => demo.tarefas.push({ id:novoId(), cliente_id:novo.id, titulo, origem:'onboarding', feita:false, prazo:dia(i * 2 + 2), criado_em:novo.criado_em }));
      PASTAS_PADRAO.forEach((nome, i) => demo.pastas.push({ id:novoId(), cliente_id:novo.id, nome, ordem:i }));
      demo.atividades.push({ id:novoId(), cliente_id:novo.id, descricao:'Cliente cadastrado', criado_em:novo.criado_em });
    }
    if (t === 'insights' && novo.visivel_cliente) demo.atividades.push({ id:novoId(), cliente_id:novo.cliente_id, descricao:'Novo insight publicado', criado_em:novo.criado_em });
    return { ...novo };
  },
  async update(t, id, obj){
    const i = demo[t].findIndex(x => x.id === id);
    demo[t][i] = { ...demo[t][i], ...obj };
    return { ...demo[t][i] };
  }
};

const apiSupabase = {
  async list(t, f = {}){
    let q = sb.from(t).select(f.select || '*');
    for (const [k, v] of Object.entries(f.eq || {}))  q = q.eq(k, v);
    for (const [k, v] of Object.entries(f.in || {}))  q = q.in(k, v);
    for (const [k, v] of Object.entries(f.gte || {})) q = q.gte(k, v);
    for (const [k, v] of Object.entries(f.lte || {})) q = q.lte(k, v);
    for (const k of (f.nulo || [])) q = q.is(k, null);
    if (f.order) q = q.order(f.order, { ascending:!f.desc, nullsFirst:false });
    if (f.limit) q = q.limit(f.limit);
    const { data, error } = await q;
    if (error) throw error;
    return data;
  },
  async insert(t, obj){
    const { data, error } = await sb.from(t).insert({ ...obj, org_id:state.org.id }).select().single();
    if (error) throw error;
    return data;
  },
  async update(t, id, obj){
    const { data, error } = await sb.from(t).update(obj).eq('id', id).select().single();
    if (error) throw error;
    return data;
  }
};

async function aoSessao(session){
  state.user = session?.user || null;
  state.membro = null; state.org = null;
  if (state.user){
    const { data, error } = await sb.from('membros').select('*, organizacoes(id, nome)').eq('user_id', state.user.id).limit(1);
    if (error) state.erro = 'Não foi possível ler seu perfil. Confira se o script SQL foi executado.';
    if (data && data.length){ state.membro = data[0]; state.org = data[0].organizacoes; }
  }
  if (!state.user) state.tela = 'login';
  else if (!state.membro) state.tela = 'criar-agencia';
  else if (state.membro.papel === 'cliente') state.tela = 'e-cliente';
  else { await entrarNoApp(); return; }
  renderAuth();
}

async function enviarLogin(form){
  const d = Object.fromEntries(new FormData(form));
  const botao = form.querySelector('[type=submit]'); botao.disabled = true;
  state.erro = '';
  try {
    if (state.loginModo === 'entrar'){
      const { error } = await sb.auth.signInWithPassword({ email:d.email.trim(), password:d.senha });
      if (error) throw new Error('E-mail ou senha incorretos.');
    } else {
      const { data, error } = await sb.auth.signUp({ email:d.email.trim(), password:d.senha, options:{ data:{ nome:d.nome.trim() } } });
      if (error) throw error;
      if (!data.session){ state.loginModo = 'entrar'; renderAuth(); avisar('Enviamos um link de confirmação para o seu e-mail.'); return; }
    }
  } catch (e){ state.erro = msgErro(e); renderAuth(); }
  finally { botao.disabled = false; }
}

async function criarAgencia(form){
  const nome = form.agencia.value.trim(); if (!nome) return;
  const botao = form.querySelector('[type=submit]'); botao.disabled = true;
  const { error } = await sb.rpc('criar_organizacao', { p_nome:nome, p_nome_usuario:state.user.user_metadata?.nome || null });
  if (error){ state.erro = msgErro(error); botao.disabled = false; renderAuth(); return; }
  const { data:{ session } } = await sb.auth.getSession();
  await aoSessao(session);
}

async function carregarBase(){
  const hoje = new Date();
  const ini = `${hoje.getFullYear()}-${pad(hoje.getMonth() + 1)}-01`;
  const fim = isoDia(new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0));
  const etapasAbertas = ETAPAS.map(e => e[0]).filter(e => e !== 'entregue');
  const hojeD = new Date(); hojeD.setDate(hojeD.getDate() - ((hojeD.getDay() + 6) % 7));
  const semIni = isoDia(hojeD); hojeD.setDate(hojeD.getDate() + 6); const semFim = isoDia(hojeD);
  const [clientes, projetos, conteudos, pagMes, pagAtrasados, eventos, semana] = await Promise.all([
    api.list('clientes',   { order:'nome' }),
    api.list('projetos',   { in:{ etapa:etapasAbertas }, order:'prazo' }),
    api.list('conteudos',  { in:{ status:CONTEUDO_ATIVO }, order:'prazo', limit:300 }),
    api.list('pagamentos', { gte:{ vencimento:ini }, lte:{ vencimento:fim } }),
    api.list('pagamentos', { eq:{ status:'pendente', tipo:'receita' }, lte:{ vencimento:dia(-1) } }),
    api.list('eventos',    { gte:{ inicio:dia(0) }, lte:{ inicio:dia(7) + 'T23:59:59' }, order:'inicio', limit:30 }),
    api.list('conteudos',  { gte:{ data_publicacao:semIni }, lte:{ data_publicacao:semFim }, order:'numero', limit:200 })
  ]);
  if (window.resolverMidias) await resolverMidias(semana).catch(() => {});
  const pags = new Map(); [...pagMes, ...pagAtrasados].forEach(p => pags.set(p.id, p));
  state.base = { clientes, projetos, conteudos, pagamentos:[...pags.values()], eventos, semana, semIni };
}

function atualizarNav(){
  const pagina = state.rota.pagina === 'cliente' ? 'clientes' : state.rota.pagina;
  document.querySelectorAll('[data-rota]').forEach(a => {
    const ativo = a.dataset.rota === pagina;
    a.classList.toggle('ativo', ativo);
    if (ativo) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  posicionarIndicadores();
}

/* ---------- Rotas ---------- */
function lerRota(){
  const p = (location.hash.replace(/^#\/?/, '') || 'inicio').split('/');
  return { pagina:p[0] || 'inicio', id:p[1], aba:p[2] };
}

async function navegar(){
  if (state.tela !== 'app') return;
  const anterior = state.rota;
  const r = lerRota();
  state.rota = r;
  atualizarNav();
  fecharResultados(); fecharCriar();
  const main = document.getElementById('main');

  if (r.pagina === 'cliente'){
    if (anterior.pagina === 'cliente' && anterior.id === r.id && state.cli && document.getElementById('aba-conteudo')){
      trocarAba(r.aba || 'visao'); return;
    }
    await abrirCliente(r.id, r.aba || 'visao');
    return;
  }
  state.cli = null;
  const paginas = Object.assign({ inicio:paginaInicio, clientes:paginaClientes }, window.PAGINAS_EXTRA || {});
  main.innerHTML = `<div class="pagina">${(paginas[r.pagina] || (() => paginaEmBreve(r.pagina)))()}</div>`;
  window.scrollTo({ top:0 });
  posicionarIndicadores(main);
  contarNumeros(main);
  window.APOS_RENDER?.[r.pagina]?.(main);
}

function itensAtencao(){
  const { conteudos, pagamentos } = state.base;
  const itens = [];
  agrupar(conteudos.filter(c => c.status === 'revisao_interna'), 'cliente_id').forEach((lista, cid) => {
    const n = lista.length;
    itens.push({ id:'rev-' + cid, nivel:'alto', cliente_id:cid, texto:`${n} ${n > 1 ? 'conteúdos aguardando' : 'conteúdo aguardando'} sua revisão.`, acao:'Revisar', rota:`#/cliente/${cid}/conteudos` });
  });
  conteudos.filter(c => c.status === 'alteracao_solicitada').forEach(c =>
    itens.push({ id:'alt-' + c.id, nivel:'medio', cliente_id:c.cliente_id, texto:`Cliente solicitou alteração no conteúdo #${c.numero}.`, detalhe:c.pedido_alteracao, acao:'Ver pedido', rota:`#/cliente/${c.cliente_id}/aprovacoes` }));
  conteudos.filter(c => c.prazo && ['ideia','planejado','em_criacao'].includes(c.status)).forEach(c => {
    const d = diffDias(c.prazo);
    if (d < 0) itens.push({ id:'atr-' + c.id, nivel:'alto', cliente_id:c.cliente_id, texto:`Conteúdo #${c.numero} está atrasado ${d === -1 ? 'desde ontem' : `há ${-d} dias`}.`, acao:'Abrir', rota:`#/cliente/${c.cliente_id}/conteudos` });
    else if (d <= 1) itens.push({ id:'ent-' + c.id, nivel:'medio', cliente_id:c.cliente_id, texto:`Entrega do #${c.numero} prevista para ${d === 0 ? 'hoje' : 'amanhã'}.`, detalhe:c.titulo, acao:'Abrir', rota:`#/cliente/${c.cliente_id}/conteudos` });
  });
  pagamentos.filter(p => p.tipo === 'receita' && p.status === 'pendente' && diffDias(p.vencimento) < 0).forEach(p => {
    const d = -diffDias(p.vencimento);
    itens.push({ id:'pag-' + p.id, nivel:'alto', cliente_id:p.cliente_id, texto:`Pagamento de ${moeda(p.valor)} pendente, venceu ${d === 1 ? 'ontem' : `há ${d} dias`}.`, acao:'Cobrar', rota:`#/cliente/${p.cliente_id}/financeiro` });
  });
  conteudos.filter(c => c.status === 'aguardando_cliente' && diffDias(c.atualizado_em || c.criado_em) <= -3).forEach(c =>
    itens.push({ id:'esp-' + c.id, nivel:'info', cliente_id:c.cliente_id, texto:`Conteúdo #${c.numero} está com o cliente há ${-diffDias(c.atualizado_em || c.criado_em)} dias.`, acao:'Ver', rota:`#/cliente/${c.cliente_id}/aprovacoes` }));
  const peso = { alto:0, medio:1, info:2 };
  return itens.filter(i => !state.dispensados.has(i.id) && clientePorId(i.cliente_id)).sort((a, b) => peso[a.nivel] - peso[b.nivel]);
}

function htmlProximosDias(){
  const itens = [];
  state.base.eventos.forEach(e => itens.push({ data:isoDia(paraData(e.inicio)), ordem:hora(e.inicio), hora:hora(e.inicio), titulo:e.titulo, sub:clientePorId(e.cliente_id)?.nome || 'Interno', rota:e.cliente_id ? `#/cliente/${e.cliente_id}` : '#/agenda' }));
  state.base.conteudos.filter(c => c.prazo && diffDias(c.prazo) >= 0 && diffDias(c.prazo) <= 7 && clientePorId(c.cliente_id)).forEach(c =>
    itens.push({ data:c.prazo, ordem:'99', hora:'Entrega', entrega:true, titulo:`#${c.numero} ${c.titulo}`, sub:clientePorId(c.cliente_id).nome, rota:`#/cliente/${c.cliente_id}/conteudos` }));
  if (!itens.length) return `<div class="dia-grupo"><p class="sub">Nenhum compromisso ou entrega nos próximos 7 dias.</p></div>`;
  itens.sort((a, b) => (a.data + a.ordem).localeCompare(b.data + b.ordem));
  const grupos = agrupar(itens.slice(0, 9), 'data');
  return [...grupos].map(([data, lista]) => `<div class="dia-grupo">
    <div class="dia-nome">${rotuloDia(data)}<span>${dataCurta(data)}</span></div>
    ${lista.map(x => `<a class="dia-item" href="${esc(x.rota)}"><span class="dia-hora ${x.entrega ? 'entrega' : ''}">${esc(x.hora)}</span><span><b>${esc(x.titulo)}</b><small>${esc(x.sub)}</small></span></a>`).join('')}
  </div>`).join('');
}

function paginaInicio(){
  const { clientes, projetos, conteudos, pagamentos } = state.base;
  const receitas = pagamentos.filter(p => p.tipo === 'receita' && p.status !== 'cancelado' && diffDias(p.vencimento) !== null && paraData(p.vencimento).getMonth() === new Date().getMonth());
  const recebido = receitas.filter(p => p.status === 'recebido').reduce((s, p) => s + Number(p.valor), 0);
  const previsto = receitas.reduce((s, p) => s + Number(p.valor), 0);
  const entregas = conteudos.filter(c => c.prazo && diffDias(c.prazo) >= 0 && diffDias(c.prazo) <= 7).length;
  const ind = [
    { rot:'Clientes ativos', ic:'clientes', val:clientes.filter(c => c.status === 'ativo').length, sub:`${clientes.filter(c => c.status === 'pendente').length} em onboarding`, rota:'#/clientes' },
    { rot:'Projetos ativos', ic:'projetos', val:projetos.length, sub:'em andamento', rota:'#/projetos' },
    { rot:'Aprovações pendentes', ic:'aprovacoes', val:conteudos.filter(c => c.status === 'aguardando_cliente').length, sub:'com os clientes', rota:'#/aprovacoes' },
    { rot:'Entregas próximas', ic:'entregas', val:entregas, sub:'nos próximos 7 dias', rota:'#/entregas' },
    { rot:'Receita do mês', ic:'financeiro', val:recebido, fmt:'moeda', sub:`recebido de ${moeda(previsto)} previstos`, rota:'#/financeiro', classe:'receita' }
  ];
  const at = itensAtencao();
  const nome = primeiroNome(state.membro?.nome) || 'você';
  const data = dataLonga(new Date());
  return `
    <section class="saudacao entra"><h1>Olá, ${esc(nome)} 👋</h1><p class="data-hoje">${data.charAt(0).toUpperCase() + data.slice(1)}</p></section>
    <div class="indicadores">
      ${ind.map((x, i) => `<a class="card ind interativo entra ${x.classe || ''}" style="--i:${i + 1}" href="${x.rota}">
        <span class="ind-rot">${icone(x.ic)}${x.rot}</span>
        <span class="ind-val" data-contar="${x.val}" ${x.fmt ? `data-fmt="${x.fmt}"` : ''}>${x.fmt ? moeda(x.val) : x.val}</span>
        <span class="ind-sub">${esc(x.sub)}</span>
      </a>`).join('')}
    </div>
    ${window.htmlSuaSemana ? htmlSuaSemana() : ''}
    <div class="grade-inicio">
      <section aria-labelledby="t-atencao">
        <div class="bloco-tit entra" style="--i:5"><h2 id="t-atencao">Precisa da sua atenção${at.length ? `<span class="n" id="n-atencao">${at.length}</span>` : ''}</h2></div>
        <div class="atencao" id="atencao">${htmlAtencao(at)}</div>
      </section>
      <aside aria-labelledby="t-dias">
        <div class="bloco-tit entra" style="--i:6"><h2 id="t-dias">Próximos dias</h2><a class="link" href="#/agenda">Ver agenda</a></div>
        <div class="card dias entra" style="--i:7">${htmlProximosDias()}</div>
      </aside>
    </div>`;
}

function dispensar(id){
  state.dispensados.add(id);
  const wrap = document.querySelector(`[data-item="${CSS.escape(id)}"]`);
  const restantes = itensAtencao();
  const n = document.getElementById('n-atencao');
  if (n){ n.textContent = restantes.length; n.style.transform = 'scale(1.25)'; setTimeout(() => n.style.transform = '', 250); }
  if (wrap){
    wrap.classList.add('saindo');
    setTimeout(() => {
      wrap.remove();
      if (!restantes.length){ document.getElementById('atencao').innerHTML = htmlAtencao([]); n?.remove(); }
    }, reduzMovimento ? 0 : 450);
  }
  avisar('Marcado como visto.');
}

function resumoCliente(c){
  const cs = state.base.conteudos.filter(x => x.cliente_id === c.id);
  const rev = cs.filter(x => x.status === 'revisao_interna').length;
  let acao = 'Tudo em dia';
  if (rev) acao = `Revisar ${rev} ${rev > 1 ? 'conteúdos' : 'conteúdo'}`;
  else if (cs.some(x => x.status === 'alteracao_solicitada')) acao = 'Ajustar pedido do cliente';
  else if (state.base.pagamentos.some(p => p.cliente_id === c.id && p.tipo === 'receita' && p.status === 'pendente' && diffDias(p.vencimento) < 0)) acao = 'Cobrar pagamento';
  else if (cs.some(x => x.status === 'aguardando_cliente')) acao = 'Aguardando aprovação';
  else if (c.status === 'pendente') acao = 'Concluir onboarding';
  const prox = cs.filter(x => x.prazo && diffDias(x.prazo) >= 0).sort((a, b) => a.prazo.localeCompare(b.prazo))[0];
  return { acao, temAcao:acao !== 'Tudo em dia', entrega:prox ? `${rotuloDia(prox.prazo)}, #${prox.numero}` : 'Nenhuma marcada' };
}

function htmlCardsClientes(){
  const f = state.filtroClientes;
  const ordem = { ativo:0, pendente:1, finalizado:2 };
  const lista = state.base.clientes.filter(c => f === 'todos' || c.status === f)
    .sort((a, b) => (ordem[a.status] - ordem[b.status]) || a.nome.localeCompare(b.nome, 'pt-BR'));
  const cards = lista.map((c, i) => {
    const r = resumoCliente(c);
    return `<a class="card cc interativo tilt entra" style="--i:${i};--cor:${esc(c.cor || '#0F766E')}" href="#/cliente/${esc(c.id)}">
      <div class="cc-topo"><span class="avatar" style="--cor:${esc(c.cor || '#0F766E')}">${iniciais(c.nome)}</span><span class="pill pill-${c.status}">${STATUS_CLIENTE[c.status]}</span></div>
      <div><h3>${esc(c.nome)}</h3><p class="cc-emp">${esc(c.empresa || '')}</p></div>
      <p class="cc-serv">${esc(c.servico || 'Serviço não informado')}</p>
      <div class="cc-rodape">
        <div class="cc-linha"><span>Próxima ação</span><span class="cc-acao ${r.temAcao ? '' : 'ok'}">${esc(r.acao)}${r.temAcao ? icone('seta') : ''}</span></div>
        <div class="cc-linha"><span>Próxima entrega</span><span>${esc(r.entrega)}</span></div>
      </div>
    </a>`;
  });
  cards.push(`<button class="card cc-novo interativo entra" style="--i:${lista.length}" data-acao="novo-cliente"><span class="mais">${icone('mais')}</span><b>Novo cliente</b><span>Só 6 informações para começar</span></button>`);
  return cards.join('');
}

async function abrirCliente(id, aba){
  const main = document.getElementById('main');
  let c = clientePorId(id);
  if (!c){
    const r = await api.list('clientes', { eq:{ id } }).catch(() => []);
    c = r[0];
  }
  if (!c){ main.innerHTML = `<div class="pagina embreve"><h1>Cliente não encontrado</h1><p>Ele pode ter sido removido.</p><p style="margin-top:20px"><a class="btn btn-claro" href="#/clientes">Ver clientes</a></p></div>`; return; }

  main.innerHTML = `<div class="pagina"><a class="voltar" href="#/clientes">${icone('voltar')}Clientes</a>
    <div class="cli-cab"><span class="avatar g" style="--cor:${esc(c.cor || '#0F766E')}">${iniciais(c.nome)}</span><div class="nome"><h1>${esc(c.nome)}</h1><p class="cli-sub">Carregando…</p></div></div>
    <div class="mini-grade" style="margin-top:34px">${'<div class="esq" style="height:128px"></div>'.repeat(4)}</div>
    <div class="esq" style="height:260px;border-radius:20px"></div></div>`;
  window.scrollTo({ top:0 });

  const eq = { cliente_id:id };
  try {
    const [projetos, conteudos, insights, pagamentos, atividades, tarefas, pastas] = await Promise.all([
      api.list('projetos',   { eq, order:'prazo' }),
      api.list('conteudos',  { eq, order:'numero', desc:true, limit:60 }),
      api.list('insights',   { eq, order:'criado_em', desc:true, limit:30 }),
      api.list('pagamentos', { eq:{ cliente_id:id, tipo:'receita' }, order:'vencimento', desc:true, limit:24 }),
      api.list('atividades', { eq, order:'criado_em', desc:true, limit:10 }),
      api.list('tarefas',    { eq, order:'criado_em' }),
      api.list('pastas',     { eq, order:'ordem' })
    ]);
    state.cli = { cliente:c, aba, projetos, conteudos, insights, pagamentos, atividades, tarefas, pastas };
    if (window.resolverMidias) await resolverMidias(conteudos).catch(() => {});
  } catch (e){ avisar(msgErro(e)); return; }
  if (state.rota.id !== id) return;   // usuária já foi para outra tela
  main.innerHTML = `<div class="pagina">${paginaCliente()}</div>`;
  posicionarIndicadores(main);
}

function trocarAba(aba){
  state.cli.aba = aba;

function htmlAba(aba){

const vazio = (texto, botao = '') => `<div class="vazio entra"><p>${texto}</p>${botao}</div>`;

const rotuloEtapa = e => (ETAPAS.find(x => x[0] === e) || [e, e])[1];
const progressoEtapa = e => Math.round((ETAPAS.findIndex(x => x[0] === e) + 1) / ETAPAS.length * 100);

function abaVisao(){
  const { cliente:c, projetos, conteudos, insights, atividades, tarefas } = state.cli;
  const proj = projetos.find(p => p.etapa !== 'entregue');
  const prox = conteudos.filter(x => x.prazo && diffDias(x.prazo) >= 0 && !['aprovado','publicado'].includes(x.status)).sort((a, b) => a.prazo.localeCompare(b.prazo))[0];
  const pend = conteudos.filter(x => x.status === 'aguardando_cliente').length;
  const ult = insights[0];
  const feitas = tarefas.filter(t => t.feita).length;
  const pct = tarefas.length ? Math.round(feitas / tarefas.length * 100) : 0;
  const mini = [
    { rot:'Projeto atual', val:proj ? esc(proj.nome) : 'Nenhum em andamento', sub:proj ? rotuloEtapa(proj.etapa) : '', aba:'projetos' },
    { rot:'Próxima entrega', val:prox ? `${rotuloDia(prox.prazo)}` : 'Nada marcado', sub:prox ? esc(`#${prox.numero} ${prox.titulo}`) : '', aba:'conteudos' },
    { rot:'Aprovações pendentes', val:pend, grande:true, sub:pend ? 'com o cliente' : 'Nada esperando', aba:'aprovacoes' },
    { rot:'Último insight', val:ult ? esc(ult.titulo) : 'Nenhum ainda', sub:ult ? tempoRelativo(ult.criado_em) : '', aba:'insights' }
  ];
  return `
    <div class="mini-grade">
      ${mini.map((m, i) => `<a class="card mini interativo entra" style="--i:${i}" href="#/cliente/${esc(c.id)}/${m.aba}">
        <span class="mini-rot">${m.rot}</span><span class="mini-val ${m.grande ? 'grande' : ''}">${m.val}</span>${m.sub ? `<span class="mini-sub">${m.sub}</span>` : ''}
      </a>`).join('')}
    </div>
    <div class="vg-grade">
      <section class="card bloco entra" style="--i:4">
        <h2>Atividade recente</h2>
        ${atividades.length ? `<ul class="atividades">${atividades.map(a => `<li><span class="atv-ponto"></span><div><b>${esc(a.descricao)}</b><small>${tempoRelativo(a.criado_em)}</small></div></li>`).join('')}</ul>` : '<p class="sub">Nenhuma atividade ainda.</p>'}
      </section>
      <section class="card bloco entra" style="--i:5">
        <h2>Tarefas</h2>
        ${tarefas.length ? `
          <div class="progresso-txt"><span id="txt-tarefas">${feitas} de ${tarefas.length} concluídas</span><span id="pct-tarefas">${pct}%</span></div>
          <div class="barra"><span id="barra-tarefas" style="width:${pct}%"></span></div>
          <ul class="checklist">${tarefas.map(t => `<li><label>
            <input type="checkbox" data-tarefa="${esc(t.id)}" ${t.feita ? 'checked' : ''}>
            <span class="chk">${icone('check')}</span><span class="txt">${esc(t.titulo)}</span>
            ${t.origem === 'onboarding' ? '<small>Onboarding</small>' : t.prazo ? `<small>${rotuloDia(t.prazo)}</small>` : ''}
          </label></li>`).join('')}</ul>` : '<p class="sub">Nenhuma tarefa. Use "Nova tarefa" acima.</p>'}
      </section>
    </div>`;
}

function paginaEmBreve(pagina){
  const info = EM_BREVE[pagina] || { fase:'', titulo:'Página não encontrada', icone:'info', texto:'Use o menu para voltar.' };
  let lista = '';
  const { conteudos } = state.base;
  if (pagina === 'aprovacoes'){
    const itens = conteudos.filter(k => ['aguardando_cliente','alteracao_solicitada'].includes(k.status));
    if (itens.length) lista = `<div class="embreve-lista"><h2>Já esperando o cliente</h2><div class="linhas">${itens.map(k => linhaConteudoGlobal(k)).join('')}</div></div>`;
  }
  if (pagina === 'entregas' || pagina === 'conteudos'){
    const itens = conteudos.filter(k => pagina === 'conteudos' || (k.prazo && diffDias(k.prazo) >= 0 && diffDias(k.prazo) <= 7));
    if (itens.length) lista = `<div class="embreve-lista"><h2>${pagina === 'entregas' ? 'Entregas dos próximos 7 dias' : 'Conteúdos em andamento'}</h2><div class="linhas">${itens.map(k => linhaConteudoGlobal(k)).join('')}</div></div>`;
  }
  return `<div class="embreve entra">
    <div class="ic">${icone(info.icone)}</div>
    ${info.fase ? `<span class="fase">Chega na ${info.fase}</span>` : ''}
    <h1>${info.titulo}</h1><p>${info.texto}</p>
  </div>${lista}`;
}
function linhaConteudoGlobal(k){
  const c = clientePorId(k.cliente_id);
  return `<a class="linha" style="text-decoration:none" href="#/cliente/${esc(k.cliente_id)}/conteudos">
    <span class="avatar p" style="--cor:${esc(c?.cor || '#0F766E')}">${iniciais(c?.nome)}</span>
    <div class="linha-tit">#${esc(k.numero)} ${esc(k.titulo)}<small>${esc(c?.nome || '')}</small></div>

  </a>`;
}

async function salvarCliente(form){
  const d = Object.fromEntries(new FormData(form));
  const obj = {
    nome:d.nome.trim(), empresa:d.empresa.trim() || null, email:d.email.trim() || null, servico:d.servico.trim() || null,
    valor_contrato:d.valor_contrato ? Number(d.valor_contrato) : null, data_inicio:d.data_inicio || null,
    status:'ativo', cor:CORES[state.base.clientes.length % CORES.length]
  };
  if (!obj.nome) return;
  const b = form.querySelector('[type=submit]'); b.disabled = true;
  try {
    const novo = await api.insert('clientes', obj);
    state.base.clientes.push(novo);
    state.base.clientes.sort((a, z) => a.nome.localeCompare(z.nome, 'pt-BR'));
    fecharModal();
    location.hash = `#/cliente/${novo.id}`;
    avisar('Cliente criado. Pastas e onboarding prontos.');
  } catch (e){ avisar(msgErro(e)); b.disabled = false; }
}

async function salvarTarefa(form){
  const d = Object.fromEntries(new FormData(form));
  const b = form.querySelector('[type=submit]'); b.disabled = true;
  try {
    const t = await api.insert('tarefas', { titulo:d.titulo.trim(), cliente_id:d.cliente_id, prazo:d.prazo || null, origem:'manual', feita:false });
    fecharModal();
    if (state.cli?.cliente.id === t.cliente_id){ state.cli.tarefas.push(t); if (state.cli.aba === 'visao') trocarAba('visao'); }
    avisar('Tarefa criada.');
  } catch (e){ avisar(msgErro(e)); b.disabled = false; }
}

async function salvarInsight(form){
  const d = Object.fromEntries(new FormData(form));
  const b = form.querySelector('[type=submit]'); b.disabled = true;
  try {
    const x = await api.insert('insights', { titulo:d.titulo.trim(), descricao:d.descricao.trim() || null, cliente_id:d.cliente_id, categoria:d.categoria, visivel_cliente:!!d.visivel_cliente, autor_nome:state.membro?.nome || null, autor_id:state.user?.id || null });
    fecharModal();
    if (state.cli?.cliente.id === x.cliente_id){
      state.cli.insights.unshift(x);
      if (x.visivel_cliente) state.cli.atividades.unshift({ id:novoId(), descricao:'Novo insight publicado', criado_em:new Date().toISOString() });
      trocarAba(state.cli.aba);
    }
    avisar(x.visivel_cliente ? 'Insight publicado para o cliente.' : 'Insight salvo como interno.');
  } catch (e){ avisar(msgErro(e)); b.disabled = false; }
}

async function marcarTarefa(input){
  const id = input.dataset.tarefa, feita = input.checked;
  const t = state.cli.tarefas.find(x => x.id === id); if (!t) return;
  t.feita = feita;
  const feitas = state.cli.tarefas.filter(x => x.feita).length, total = state.cli.tarefas.length, pct = Math.round(feitas / total * 100);
  document.getElementById('txt-tarefas').textContent = `${feitas} de ${total} concluídas`;
  document.getElementById('pct-tarefas').textContent = `${pct}%`;
  document.getElementById('barra-tarefas').style.width = pct + '%';
  try { await api.update('tarefas', id, { feita }); if (feitas === total) avisar('Tudo concluído por aqui.'); }
  catch (e){ t.feita = !feita; input.checked = !feita; avisar(msgErro(e)); }
}

function resultadosBusca(texto){
  const q = normalizar(texto.trim());
  if (q.length < 2) return null;
  const { clientes, projetos, conteudos } = state.base;
  const nomeCli = id => clientePorId(id)?.nome || '';
  const casa = (...partes) => normalizar(partes.join(' ')).includes(q);
  const grupos = [
    ['Clientes', clientes.filter(c => casa(c.nome, c.empresa, c.segmento, c.cidade)).slice(0, 5).map(c => ({ tit:c.nome, sub:c.empresa || c.servico, rota:`#/cliente/${c.id}`, avatar:c })) ],
    ['Projetos', projetos.filter(p => casa(p.nome, nomeCli(p.cliente_id))).slice(0, 4).map(p => ({ tit:p.nome, sub:`${nomeCli(p.cliente_id)}, ${rotuloEtapa(p.etapa)}`, rota:`#/cliente/${p.cliente_id}/projetos`, ic:'projetos' })) ],
    ['Conteúdos', conteudos.filter(k => casa(k.titulo, '#' + k.numero, k.formato, nomeCli(k.cliente_id))).slice(0, 5).map(k => ({ tit:`#${k.numero} ${k.titulo}`, sub:`${nomeCli(k.cliente_id)}, ${STATUS_CONTEUDO[k.status]}`, rota:`#/cliente/${k.cliente_id}/conteudos`, ic:'conteudos' })) ]
  ].filter(g => g[1].length);
  return grupos;
}

function renderResultados(){
  const input = document.getElementById('busca');
  const alvo = document.getElementById('resultados');
  const grupos = resultadosBusca(input.value);
  if (!grupos){ alvo.innerHTML = ''; return; }
  if (!grupos.length){ alvo.innerHTML = `<div class="resultados"><div class="res-vazio">Nada encontrado para “${esc(input.value.trim())}”.</div></div>`; return; }
  let idx = 0;
  alvo.innerHTML = `<div class="resultados" role="listbox">${grupos.map(([nome, itens]) => `<div class="res-grupo">${nome}</div>${itens.map(it => {
    const i = idx++;
    return `<a class="res-item ${i === state.resultadosFoco ? 'foco' : ''}" href="${esc(it.rota)}" data-idx="${i}" role="option">

function posicionarIndicadores(raiz = document){

    const at = cont.querySelector('.ativo');
    if (!ind) return;
    if (!at){ ind.style.opacity = '0'; return; }
    const primeiraVez = !ind.dataset.pronto;
    if (primeiraVez) ind.style.transition = 'none';
    ind.style.opacity = '1';
    if (ind.classList.contains('nav-ind')) ind.style.transform = `translateY(${at.offsetTop}px)`;
    else { ind.style.width = at.offsetWidth + 'px'; ind.style.transform = `translateX(${at.offsetLeft}px)`; }
    if (primeiraVez){ void ind.offsetWidth; ind.style.transition = ''; ind.dataset.pronto = '1'; }
  });
}

function contarNumeros(raiz){
  raiz.querySelectorAll('[data-contar]').forEach(el => {
    const alvo = Number(el.dataset.contar) || 0;
    const fmt = v => el.dataset.fmt === 'moeda' ? moeda(v) : Math.round(v).toLocaleString('pt-BR');
    if (reduzMovimento || !alvo){ el.textContent = fmt(alvo); return; }
    const t0 = performance.now(), dur = 1100;
    const passo = t => {
      const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 4);
      el.textContent = fmt(alvo * e);
      if (p < 1) requestAnimationFrame(passo);
    };
    requestAnimationFrame(passo);
  });
}

let cardAtual = null;
function soltarCard(){
  if (!cardAtual) return;
  cardAtual.classList.remove('movendo');
  cardAtual.style.transform = '';
  cardAtual = null;
}
document.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return;
  const luz = e.target.closest('.luz');
  if (luz){ const r = luz.getBoundingClientRect(); luz.style.setProperty('--mx', (e.clientX - r.left) + 'px'); luz.style.setProperty('--my', (e.clientY - r.top) + 'px'); }
  const card = e.target.closest('.interativo');
  if (card !== cardAtual) soltarCard();
  if (!card) return;
  cardAtual = card;
  const r = card.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  card.style.setProperty('--mx', x + 'px');
  card.style.setProperty('--my', y + 'px');
  if (card.classList.contains('tilt') && !reduzMovimento){
    card.classList.add('movendo');
    const rx = ((y / r.height) - .5) * -6, ry = ((x / r.width) - .5) * 6;
    card.style.transform = `perspective(1000px) rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg) translateY(-5px)`;
  }
});

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k' && state.tela === 'app'){ e.preventDefault(); document.getElementById('busca')?.focus(); return; }
  if (e.key === 'Escape'){

});

const somarDias = (iso, n) => { const d = paraData(iso); d.setDate(d.getDate() + n); return isoDia(d); };
const inicioSemana = iso => { const d = paraData(iso); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return isoDia(d); };
const inicioMes = iso => iso.slice(0, 8) + '01';
const fimMes = iso => { const d = paraData(iso); return isoDia(new Date(d.getFullYear(), d.getMonth() + 1, 0)); };
const diasEntre = (a, b) => Math.round((paraData(b) - paraData(a)) / 864e5);
const maiuscula = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const nomeMes = iso => maiuscula(paraData(iso).toLocaleDateString('pt-BR', { month:'long', year:'numeric' }));

function rotuloPeriodo(visao, ref){
  if (visao === 'mes') return nomeMes(ref);
  if (visao === 'dia') return maiuscula(paraData(ref).toLocaleDateString('pt-BR', { weekday:'long', day:'numeric', month:'long' }));
  const a = paraData(inicioSemana(ref)), b = paraData(somarDias(inicioSemana(ref), 6));
  const m = d => d.toLocaleDateString('pt-BR', { month:'short' }).replace('.', '');
  return a.getMonth() === b.getMonth()
    ? `${a.getDate()} – ${b.getDate()} de ${a.toLocaleDateString('pt-BR', { month:'long' })}`
    : `${a.getDate()} ${m(a)} – ${b.getDate()} ${m(b)}`;
}
function moverRef(ref, visao, dir){
  if (dir === 0) return dia(0);
  if (visao === 'mes'){ const d = paraData(ref); return isoDia(new Date(d.getFullYear(), d.getMonth() + dir, 1)); }
  if (visao === 'dia') return somarDias(ref, dir);
  return somarDias(ref, 7 * dir);
}

    resumo = `${n} ${n === 1 ? 'publicação' : 'publicações'} nesta semana. Arraste os cards para mudar o dia.`;
  } else if (cont.visao === 'mes'){
    const n = itens.filter(k => k.data_publicacao && k.data_publicacao.slice(0, 7) === cont.ref.slice(0, 7)).length;
    resumo = `${n} ${n === 1 ? 'publicação' : 'publicações'} em ${nomeMes(cont.ref).toLowerCase()}.`;
  } else if (cont.visao === 'kanban') resumo = 'Arraste os cards entre as colunas para mudar a etapa.';
  else resumo = `${itens.length} conteúdos.`;
  document.getElementById('cont-resumo').textContent = resumo;
  const s = corpo.querySelector('.semana');
  if (s && s.scrollWidth > s.clientWidth){ const h = s.querySelector('.hoje'); if (h) s.scrollLeft = h.offsetLeft - 8; }
}

function visaoSemana(){
  const ini = inicioSemana(cont.ref);
  const itens = contFiltrados();
  const semData = itens.filter(k => !k.data_publicacao);
  const cols = [...Array(7)].map((_, i) => {
    const d = somarDias(ini, i);
    const doDia = itens.filter(k => k.data_publicacao === d).sort((a, b) => a.numero - b.numero);
    const dd = diffDias(d);
    return `<section class="sem-col ${dd === 0 ? 'hoje' : ''} ${dd < 0 ? 'passado' : ''}" aria-label="${maiuscula(paraData(d).toLocaleDateString('pt-BR', { weekday:'long', day:'numeric', month:'long' }))}">
      <header class="sem-cab"><span class="sem-num">${paraData(d).getDate()}</span><span class="sem-dia">${dd === 0 ? 'Hoje' : DIAS_SEMANA[i]}</span>${doDia.length ? `<span class="sem-qtd">${doDia.length}</span>` : ''}</header>
      <div class="sem-lista" data-soltar-dia="${d}">${doDia.map((k, j) => cardConteudo(k, i + j)).join('')}</div>
      <button class="sem-add" data-acao="novo-conteudo" data-dia="${d}">${icone('mais')}Adicionar</button>
    </section>`;
  }).join('');
  return `<div class="semana">${cols}</div>
    <section class="sem-sem-data">
      <h2>Sem data definida <span>${semData.length}</span></h2>
      <div class="faixa" data-soltar-dia="">${semData.length ? semData.map((k, i) => cardConteudo(k, i)).join('') : '<p class="kb-vazio" style="grid-column:1/-1">Arraste um card para cá para tirar a data</p>'}</div>
    </section>`;
}

function visaoKanban(){
  const itens = contFiltrados();
  return `<div class="kanban">${Object.keys(STATUS_CONTEUDO).map(s => {
    const l = itens.filter(k => k.status === s).sort((a, b) => (a.data_publicacao || '9').localeCompare(b.data_publicacao || '9'));
    return `<section class="kb-col" data-soltar-status="${s}">
      <header class="kb-cab"><span class="kb-ponto ${TOM_CONTEUDO[s] || ''}"></span>${STATUS_CONTEUDO[s]}<span class="kb-qtd">${l.length}</span></header>
      <div class="kb-lista">${l.map((k, i) => cardConteudo(k, i, 'kanban')).join('') || '<p class="kb-vazio">Arraste para cá</p>'}</div>
    </section>`;
  }).join('')}</div>`;
}

function gradeMes(ref, porDia, htmlItem, ctx, soltar){
  const ini = inicioSemana(inicioMes(ref));
  const mes = paraData(ref).getMonth();
  const nSem = Math.ceil((diasEntre(ini, fimMes(ref)) + 1) / 7);
  let cells = '';
  for (let i = 0; i < nSem * 7; i++){
    const d = somarDias(ini, i);
    const its = porDia(d);
    cells += `<div class="mes-dia ${paraData(d).getMonth() !== mes ? 'fora' : ''} ${diffDias(d) === 0 ? 'hoje' : ''}" data-acao="ir-dia" data-ctx="${ctx}" data-dia="${d}" ${soltar ? `data-soltar-dia="${d}"` : ''}>
      <span class="mes-n">${paraData(d).getDate()}</span>
      ${its.slice(0, 3).map(htmlItem).join('')}
      ${its.length > 3 ? `<span class="mes-mais">+${its.length - 3} mais</span>` : ''}
    </div>`;
  }
  return `<div class="mes entra"><div class="mes-cab">${DIAS_SEMANA.map(d => `<span>${d}</span>`).join('')}</div><div class="mes-grade">${cells}</div></div>`;
}
function visaoMes(){
  const itens = contFiltrados();
  return gradeMes(cont.ref, d => itens.filter(k => k.data_publicacao === d),
    k => `<button class="mes-item" data-conteudo="${esc(k.id)}" draggable="true" title="#${esc(k.numero)} ${esc(k.titulo)}"><span class="thumb">${arteMini(k)}</span><span class="t">${esc(k.titulo)}</span></button>`,
    'cont', true);
}

function visaoLista(){
  const itens = contFiltrados().sort((a, b) => (a.data_publicacao || '9999').localeCompare(b.data_publicacao || '9999'));
  if (!itens.length) return vazio('Nenhum conteúdo com esse filtro.');
  return `<div class="linhas entra">${itens.map(k => {
    const c = clientePorId(k.cliente_id);
    return `<div class="linha lc" data-conteudo="${esc(k.id)}" tabindex="0">
      <span class="thumb">${arteMini(k)}</span>
      <span class="linha-num">#${esc(k.numero)}</span>
      <div class="linha-tit">${esc(k.titulo)}<small>${esc(c?.nome || '')}, ${esc(k.formato || '')}</small></div>
      ${pillConteudo(k.status)}
      <span class="linha-data">${k.data_publicacao ? rotuloDia(k.data_publicacao) : 'Sem data'}</span>
    </div>`;
  }).join('')}</div>`;
}

async function moverConteudo(id, patch){
  const k = cont.itens.find(x => x.id === id);
  if (!k || Object.keys(patch).every(c => (k[c] || null) === (patch[c] || null))) return;
  const antes = { ...k };
  Object.assign(k, patch);
  renderConteudos();
  document.querySelector(`[data-conteudo="${CSS.escape(id)}"]`)?.classList.add('pousou');
  try {
    const salvo = await api.update('conteudos', id, patch);
    Object.assign(k, salvo);
    if ('status' in patch) avisar(`#${k.numero} agora está em ${STATUS_CONTEUDO[patch.status]}.`);
    else if (patch.data_publicacao){
      const r = rotuloDia(patch.data_publicacao);
      avisar(`#${k.numero} agendado para ${['Hoje','Amanhã','Ontem'].includes(r) ? r.toLowerCase() + ', ' : ''}${dataCurta(patch.data_publicacao)}.`);
    } else avisar(`#${k.numero} ficou sem data.`);
    atualizarBase();
  } catch (e){ Object.assign(k, antes); renderConteudos(); avisar(msgErro(e)); }
}

function previewGaveta(){
  const e = state.edit, f = document.getElementById('form-conteudo');
  const k = { ...e.k };
  if (f){
    k.titulo = f.titulo.value || 'Sem título';
    k.formato = f.querySelector('[name=formato]:checked')?.value || k.formato;
    k.cliente_id = f.cliente_id.value;
  }
  const html = arteHTML(k, e.preview);
  return html.includes('<video') ? html.replace('<video ', '<video controls ') : html;
}
function atualizarPreview(){
  const alvo = document.getElementById('gav-preview'); if (!alvo) return;
  alvo.innerHTML = previewGaveta();
  const tem = !!(state.edit.preview || urlMidia(state.edit.k));
  document.getElementById('btn-remover-midia').hidden = !tem;
}
function escolherArquivo(file){
  if (!file) return;
  if (!/^image\/|^video\//.test(file.type)){ avisar('Envie uma imagem ou um vídeo.'); return; }
  if (file.size > 50 * 1024 * 1024){ avisar('O arquivo passa de 50 MB. Envie uma versão menor.'); return; }
  const e = state.edit;
  if (e.preview && e.arquivo) URL.revokeObjectURL(e.preview);
  e.arquivo = file;
  e.preview = URL.createObjectURL(file);
  e.k.midia_tipo = file.type.startsWith('video') ? 'video' : 'imagem';
  atualizarPreview();
}
function fecharGaveta(){
  const alvo = document.getElementById('gaveta');
  if (!alvo.innerHTML) return;
  alvo.innerHTML = '';
  document.body.style.overflow = '';
  state.edit?.voltar?.focus?.();
  state.edit = null;
}

async function salvarConteudo(form){
  const e = state.edit;
  const d = Object.fromEntries(new FormData(form));
  const limpo = v => (v || '').trim() || null;
  const obj = {
    titulo:d.titulo.trim(), cliente_id:d.cliente_id, formato:d.formato || 'Post', status:d.status,
    data_publicacao:d.data_publicacao || null, prazo:d.prazo || null,
    objetivo:limpo(d.objetivo), gancho:limpo(d.gancho), texto:limpo(d.texto), cta:limpo(d.cta),
    legenda:limpo(d.legenda), observacao_agencia:limpo(d.observacao_agencia),
    midia_tipo:e.k.midia_tipo || null, midia_url:e.k.midia_url || null, midia_path:e.k.midia_path || null
  };
  if (!obj.titulo) return;
  const b = form.querySelector('[type=submit]'); b.disabled = true; b.textContent = e.arquivo ? 'Enviando arte…' : 'Salvando…';
  try {
    if (e.arquivo){ Object.assign(obj, await api.enviarMidia(e.arquivo, obj.cliente_id)); obj.midia_tipo = e.k.midia_tipo; }
    let salvo = e.novo ? await api.insert('conteudos', obj) : await api.update('conteudos', e.k.id, obj);
    if (e.enviar && window.enviarParaAprovacao){ b.textContent = 'Enviando ao cliente…'; salvo = await window.enviarParaAprovacao(salvo); }
    await resolverMidias([salvo]).catch(() => {});
    aplicarConteudoSalvo(salvo);
    fecharGaveta();
    avisar(e.enviar ? `Versão ${salvo._versao} enviada para ${clientePorId(salvo.cliente_id)?.nome || 'o cliente'} aprovar.` : e.novo ? `Conteúdo #${salvo.numero} criado.` : 'Conteúdo salvo.');
  } catch (err){ avisar(msgErro(err)); e.enviar = false; b.disabled = false; b.textContent = e.novo ? 'Criar conteúdo' : 'Salvar'; }
}
function aplicarConteudoSalvo(k, removido = false){
  const aplicar = arr => {
    if (!arr) return;
    const i = arr.findIndex(x => x.id === k.id);
    if (removido){ if (i >= 0) arr.splice(i, 1); return; }
    if (i >= 0) arr[i] = { ...arr[i], ...k }; else arr.push(k);
  };
  aplicar(cont.itens);
  aplicar(ag.pubs);
  if (state.cli){
    if (!removido && k.cliente_id !== state.cli.cliente.id) state.cli.conteudos = state.cli.conteudos.filter(x => x.id !== k.id);
    else { aplicar(state.cli.conteudos); state.cli.conteudos.sort((a, b) => b.numero - a.numero); }
  }
  const p = state.rota.pagina;
  if (p === 'conteudos') renderConteudos();
  else if (p === 'agenda') renderAgenda();
  else if (p === 'cliente' && state.cli) trocarAba(state.cli.aba);
  atualizarBase();
  window.RECARREGAR?.[p]?.();
}
async function excluirConteudo(){
  const k = state.edit?.k; if (!k?.id) return;
  if (!confirm(`Excluir o conteúdo #${k.numero}? Isso não pode ser desfeito.`)) return;
  try {
    await api.remove('conteudos', k.id);
    if (!MODO_DEMO && k.midia_path) sb.storage.from('arquivos').remove([k.midia_path]).catch(() => {});
    fecharGaveta();
    aplicarConteudoSalvo(k, true);
    avisar('Conteúdo excluído.');
  } catch (e){ avisar(msgErro(e)); }
}

/* ---------- Agenda visual: grade de horários ---------- */
const AG_INI = 7, AG_FIM = 22;
const minutosDe = s => { const d = paraData(s); return d.getHours() * 60 + d.getMinutes(); };
function fimMin(e){
  const ini = minutosDe(e.inicio);
  if (!e.fim) return ini + 60;
  const mesmoDia = isoDia(paraData(e.fim)) === isoDia(paraData(e.inicio));
  return mesmoDia ? Math.max(ini + 15, minutosDe(e.fim)) : 24 * 60;
}
function faixasEventos(evs){
  const ord = [...evs].sort((a, b) => minutosDe(a.inicio) - minutosDe(b.inicio));
  const res = {}; let grupo = [], fimGrupo = -1, ativos = [];
  const fechar = () => { const tot = Math.max(1, ...grupo.map(id => res[id].lane + 1)); grupo.forEach(id => res[id].total = tot); grupo = []; };
  for (const e of ord){
    const ini = minutosDe(e.inicio), fim = Math.max(ini + 30, fimMin(e));
    if (grupo.length && ini >= fimGrupo){ fechar(); ativos = []; fimGrupo = -1; }
    ativos = ativos.filter(a => a.fim > ini);
    let lane = 0; while (ativos.some(a => a.lane === lane)) lane++;
    ativos.push({ lane, fim }); res[e.id] = { lane, total:1 }; grupo.push(e.id);
    fimGrupo = Math.max(fimGrupo, fim);
  }
  if (grupo.length) fechar();
  return res;
}
const faixaHorario = e => `${hora(e.inicio)} – ${e.fim ? hora(e.fim) : hora(new Date(paraData(e.inicio).getTime() + 3600000).toISOString())}`;
const corEvento = e => clientePorId(e.cliente_id)?.cor || '#8B9290';

function htmlEvento(e){

}
function htmlPub(k){

  return `<button class="pub-linha" style="--cor:${esc(c?.cor || '#0F766E')}" data-conteudo="${esc(k.id)}" title="${esc(k.formato || 'Post')}: ${esc(k.titulo)} (${esc(c?.nome || '')})"><i></i><b>${esc(k.formato || 'Post')}</b><span>${esc(k.titulo)}</span></button>`;
}

function gradeHoras(dias, hh, modo){
  const agora = new Date(), minAgora = agora.getHours() * 60 + agora.getMinutes();
  const horas = []; for (let h = AG_INI; h < AG_FIM; h++) horas.push(h);
  const topo = `<div class="tg-topo">
    <div class="tg-linha"><span class="tg-canto"></span>${dias.map(d => {
      const dd = diffDias(d), n = eventosDoDia(d).length;
      return `<button class="tg-dia ${dd === 0 ? 'hoje' : ''} ${dd < 0 ? 'passado' : ''}" data-acao="ir-dia" data-ctx="ag" data-dia="${d}">
        <span class="tg-dnome">${dd === 0 ? 'Hoje' : DIAS_SEMANA[(paraData(d).getDay() + 6) % 7]}</span><span class="tg-dnum">${paraData(d).getDate()}</span>
        <span class="tg-dqtd">${n ? `${n} ${n === 1 ? 'compromisso' : 'compromissos'}` : 'Livre'}</span></button>`;
    }).join('')}</div>
    ${ag.mostrarPubs ? `<div class="tg-linha tg-pubs"><span class="tg-rot">Posts</span>${dias.map(d => `<div class="tg-pubs-dia">${pubsDoDia(d).map(htmlPub).join('')}</div>`).join('')}</div>` : ''}
  </div>`;
  const cols = dias.map(d => {
    const evs = eventosDoDia(d), L = faixasEventos(evs), hoje = diffDias(d) === 0;
    return `<div class="tg-col ${hoje ? 'hoje' : ''}" data-dia="${d}" data-hh="${hh}" title="Clique num horário livre para criar um evento">
      ${evs.map((e, i) => {
        const ini = Math.max(AG_INI * 60, minutosDe(e.inicio));
        const fim = Math.min(AG_FIM * 60, Math.max(ini + 30, fimMin(e)));
        const top = (ini - AG_INI * 60) / 60 * hh, h = Math.max(24, (fim - ini) / 60 * hh - 3);
        const l = L[e.id], c = clientePorId(e.cliente_id);
        return `<button class="tg-ev entra ${h < 46 ? 'curto' : ''}" style="--i:${i};--cor:${esc(corEvento(e))};top:${top + 1}px;height:${h}px;left:calc(${l.lane / l.total * 100}% + 3px);width:calc(${100 / l.total}% - 6px)" data-evento="${esc(e.id)}">
          <b>${esc(e.titulo)}</b><span>${faixaHorario(e)}${c ? ', ' + esc(c.nome) : ', Interno'}</span></button>`;
      }).join('')}
      ${hoje && minAgora >= AG_INI * 60 && minAgora < AG_FIM * 60 ? `<span class="tg-agora" style="top:${(minAgora - AG_INI * 60) / 60 * hh}px"></span>` : ''}
    </div>`;
  }).join('');
  return `<div class="tg modo-${modo}" style="--hh:${hh}px;--cols:${dias.length}">
    <div class="tg-rolagem" data-hh="${hh}"><div class="tg-interno">
      ${topo}
      <div class="tg-linha tg-corpo" style="height:${(AG_FIM - AG_INI) * hh}px"><div class="tg-horas">${horas.map(h => `<span>${pad(h)}:00</span>`).join('')}</div>${cols}</div>
    </div></div>
  </div>`;
}

    if (id === 'form-cfg-agencia'){
      if (!MODO_DEMO){ const { error } = await sb.from('organizacoes').update({ nome:d.nome.trim() }).eq('id', state.org.id); if (error) throw error; }
      state.org.nome = d.nome.trim(); atualizarNomesNaTela(); avisar('Nome da agência salvo.');
    }
    if (id === 'form-cfg-perfil'){
      if (!MODO_DEMO){ const { error } = await sb.rpc('atualizar_meu_nome', { p_nome:d.nome }); if (error) throw error; }
      state.membro.nome = d.nome.trim(); atualizarNomesNaTela(); avisar('Seu nome foi atualizado.');
    }
    if (id === 'form-convite'){
      const email = d.email.trim().toLowerCase();
      if (cfg.membros.some(m => (m.email || '').toLowerCase() === email)){ avisar('Essa pessoa já está na equipe.'); return; }
      const c = await api.insert('convites', { email, papel:'equipe' });
      cfg.convites.push(c); renderConfig(); avisar(`Convite criado para ${email}.`);
    }
    if (id === 'form-atalho'){
      const a = await api.insert('atalhos', { nome:d.nome.trim(), url:urlCompleta(d.url.trim()), ordem:(state.atalhos?.length || 0) + 1 });
      state.atalhos.push(a); renderConfig(); avisar(`Atalho ${a.nome} adicionado.`);
    }
  } catch (e){ avisar(msgErro(e)); }
  finally { if (b.isConnected) b.disabled = false; }
}

let arrastando = null;
const SELETOR_ALVO = '[data-soltar-dia],[data-soltar-status],[data-soltar-etapa]';
function limparAlvos(){ document.querySelectorAll('.alvo').forEach(x => x.classList.remove('alvo')); }
document.addEventListener('dragstart', e => {
  const el = e.target.closest?.('[data-conteudo][draggable="true"],[data-projeto][draggable="true"]');
  if (!el) return;
  arrastando = el.dataset.conteudo ? { tipo:'conteudo', id:el.dataset.conteudo } : { tipo:'projeto', id:el.dataset.projeto };
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', arrastando.id);
  soltarCard();
  requestAnimationFrame(() => el.classList.add('arrastando'));
});
document.addEventListener('dragend', () => {
  document.querySelectorAll('.arrastando').forEach(x => x.classList.remove('arrastando'));
  limparAlvos(); arrastando = null;
});
document.addEventListener('dragover', e => {
  // arquivo vindo do computador para a gaveta
  const midia = e.target.closest?.('#gav-midia');
  if (midia && [...(e.dataTransfer?.types || [])].includes('Files')){ e.preventDefault(); midia.classList.add('alvo'); return; }
  if (!arrastando) return;
  const alvo = e.target.closest?.(SELETOR_ALVO);
  const serve = alvo && (arrastando.tipo === 'projeto' ? 'soltarEtapa' in alvo.dataset : !('soltarEtapa' in alvo.dataset));
  if (!serve){ limparAlvos(); return; }
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  if (!alvo.classList.contains('alvo')){ limparAlvos(); alvo.classList.add('alvo'); }
});
document.addEventListener('dragleave', e => {
  const midia = e.target.closest?.('#gav-midia');
  if (midia && !midia.contains(e.relatedTarget)) midia.classList.remove('alvo');
});
document.addEventListener('drop', e => {
  const midia = e.target.closest?.('#gav-midia');
  if (midia && e.dataTransfer?.files?.length){ e.preventDefault(); midia.classList.remove('alvo'); escolherArquivo(e.dataTransfer.files[0]); return; }
  const alvo = e.target.closest?.(SELETOR_ALVO);
  const a = arrastando;
  limparAlvos();
  if (!alvo || !a) return;
  e.preventDefault();
  if (a.tipo === 'projeto' && 'soltarEtapa' in alvo.dataset) moverProjeto(a.id, alvo.dataset.soltarEtapa);
  else if (a.tipo === 'conteudo' && 'soltarStatus' in alvo.dataset) moverConteudo(a.id, { status:alvo.dataset.soltarStatus });
  else if (a.tipo === 'conteudo' && 'soltarDia' in alvo.dataset) moverConteudo(a.id, { data_publicacao:alvo.dataset.soltarDia || null });
});

document.addEventListener('click', async e => {
  if (!e.target.closest('.atalhos-wrap')){ const p = document.getElementById('pop-atalhos'); if (p) p.innerHTML = ''; }

  // itens clicáveis (vêm antes das ações do dia do calendário)
  const item = e.target.closest('[data-conteudo],[data-projeto],[data-evento]');
  if (item && !e.target.closest('[data-acao]:not(.mes-dia):not(.hora-linha)')){
    if (item.dataset.conteudo){ const k = acharConteudo(item.dataset.conteudo); if (k) abrirGaveta(k); }
    else if (item.dataset.projeto){ const p = proj.itens.find(x => x.id === item.dataset.projeto); if (p) modalProjeto(p); }
    else if (item.dataset.evento) abrirEvento(item.dataset.evento);
    return;
  }

  const el = e.target.closest('[data-acao]'); if (!el) return;
  const a = el.dataset.acao, ctx = el.dataset.ctx;
  switch (a){
    case 'novo-conteudo': fecharCriar(); novoConteudo({ dia:el.dataset.dia, cliente:el.dataset.cliente }); break;
    case 'novo-projeto': fecharCriar(); modalProjeto(null); break;
    case 'novo-evento': fecharCriar(); modalEvento(null, { dia:el.dataset.dia, hora:el.dataset.hora }); break;
    case 'excluir-projeto': excluirProjeto(); break;
    case 'excluir-evento': excluirEvento(); break;
    case 'fechar-gaveta': fecharGaveta(); break;
    case 'excluir-conteudo': excluirConteudo(); break;
    case 'midia-link': {
      const url = prompt('Cole o link direto da imagem ou do vídeo (termina em .jpg, .png, .mp4…)');
      if (!url) break;
      Object.assign(state.edit.k, { midia_url:urlCompleta(url.trim()), midia_path:null, midia_tipo:/\.(mp4|mov|webm|m4v)(\?|$)/i.test(url) ? 'video' : 'imagem' });
      state.edit.arquivo = null; state.edit.preview = null; atualizarPreview();
      break;
    }
    case 'midia-remover':
      Object.assign(state.edit.k, { midia_url:null, midia_path:null, midia_tipo:null });
      state.edit.arquivo = null; state.edit.preview = null; atualizarPreview();
      break;
    case 'visao':
      if (ctx === 'cont'){ cont.visao = el.dataset.valor; trocarSegmento('cont', cont.visao); renderConteudos(); }
      if (ctx === 'ag'){ ag.visao = el.dataset.valor; trocarSegmento('ag', ag.visao); renderAgenda(); }
      break;
    case 'periodo': {
      const dir = Number(el.dataset.dir);
      if (ctx === 'cont'){ cont.ref = moverRef(cont.ref, cont.visao, dir); await carregarConteudos().catch(err => avisar(msgErro(err))); renderConteudos(); }
      if (ctx === 'ag'){ ag.ref = moverRef(ag.ref, ag.visao, dir); await carregarAgenda().catch(err => avisar(msgErro(err))); renderAgenda(); }
      break;
    }
    case 'ir-dia':
      if (ctx === 'cont'){ cont.ref = el.dataset.dia; cont.visao = 'semana'; trocarSegmento('cont', 'semana'); renderConteudos(); }
      if (ctx === 'ag'){ ag.ref = el.dataset.dia; ag.visao = 'dia'; trocarSegmento('ag', 'dia'); await carregarAgenda().catch(() => {}); renderAgenda(); }
      break;
    case 'filtro-cli':
      if (ctx === 'cont'){ cont.cliente = el.dataset.valor; renderConteudos(); }
      if (ctx === 'proj'){ proj.cliente = el.dataset.valor; renderProjetos(); }
      break;
    case 'atalhos': abrirAtalhos(); break;
    case 'remover-convite':
      e.preventDefault();
      try { await api.remove('convites', el.dataset.id); cfg.convites = cfg.convites.filter(c => c.id !== el.dataset.id); renderConfig(); avisar('Convite cancelado.'); } catch (err){ avisar(msgErro(err)); }
      break;
    case 'remover-atalho':
      e.preventDefault(); e.stopPropagation();
      try { await api.remove('atalhos', el.dataset.id); state.atalhos = state.atalhos.filter(x => x.id !== el.dataset.id); renderConfig(); avisar('Atalho removido.'); } catch (err){ avisar(msgErro(err)); }
      break;
  }
});

function htmlSuaSemana(){

const CATEGORIAS_DESPESA = ['Ferramentas','Anúncios','Equipe','Impostos','Estrutura','Outros'];
const RECORRENCIA = { unico:'Não repete', mensal:'Todo mês', trimestral:'A cada 3 meses', anual:'Todo ano' };
const MESES_REC = { mensal:1, trimestral:3, anual:12 };
const fin = { ref:dia(0), aba:'todos', itens:[], anteriores:[], historico:[] };
const ehAtrasado = p => p.status === 'pendente' && diffDias(p.vencimento) < 0;

async function carregarFinanceiro(){
  const ini = inicioMes(fin.ref), fim = fimMes(fin.ref);
  const [hist, anteriores] = await Promise.all([
    api.list('pagamentos', { gte:{ vencimento:somarMeses(ini, -5) }, lte:{ vencimento:fim }, order:'vencimento', limit:3000 }),
    api.list('pagamentos', { eq:{ status:'pendente', tipo:'receita' }, lte:{ vencimento:somarDias(ini, -1) }, order:'vencimento', limit:200 })
  ]);
  fin.historico = hist;
  fin.itens = hist.filter(p => p.vencimento >= ini && p.vencimento <= fim);
  fin.anteriores = anteriores;
}

function paginaFinanceiro(){

function renderFinanceiro(animar = true){
  const corpo = document.getElementById('fin-corpo'); if (!corpo) return;
  document.getElementById('fin-ferr').innerHTML = navPeriodo('fin', 'mes', fin.ref);
  const it = fin.itens.filter(p => p.status !== 'cancelado');
  const rec = it.filter(p => p.tipo === 'receita'), desp = it.filter(p => p.tipo === 'despesa');
  const receita = soma(rec), recebido = soma(rec.filter(p => p.status === 'recebido'));
  const aReceber = soma(rec.filter(p => p.status === 'pendente')), atrasado = soma(rec.filter(ehAtrasado));
  const despesas = soma(desp), despPagas = soma(desp.filter(p => p.status === 'recebido'));
  const lucro = recebido - despPagas, lucroPrev = receita - despesas;
  const antes = soma(fin.anteriores);
  const kpis = [
    { rot:'Receita do mês', ic:'financeiro', val:receita, sub:`${rec.length} ${rec.length === 1 ? 'cobrança' : 'cobranças'}` },
    { rot:'Recebido', ic:'entrada', val:recebido, sub:receita ? `${Math.round(recebido / receita * 100)}% da receita` : 'nada previsto', cls:'verde' },
    { rot:'A receber', ic:'agenda', val:aReceber, sub:atrasado ? `${moeda(atrasado)} atrasado` : 'nada atrasado', cls:atrasado ? 'alerta' : '' },
    { rot:'Despesas', ic:'saida', val:despesas, sub:`${moeda(despPagas)} já pagos` },
    { rot:'Lucro', ic:'insight', val:lucro, sub:`previsto no mês: ${moeda(lucroPrev)}`, cls:lucro < 0 ? 'negativo destaque' : 'destaque' }
  ];
  const pc = v => receita ? Math.max(0, v / receita * 100) : 0;
  const meses = [...Array(6)].map((_, i) => somarMeses(inicioMes(fin.ref), i - 5));
  const serie = meses.map(m => {
    const doMes = fin.historico.filter(p => p.vencimento.slice(0, 7) === m.slice(0, 7) && p.status !== 'cancelado');
    return { m, r:soma(doMes.filter(p => p.tipo === 'receita' && p.status === 'recebido')), d:soma(doMes.filter(p => p.tipo === 'despesa')) };
  });
  const max = Math.max(1, ...serie.map(x => Math.max(x.r, x.d)));
  const abas = [['todos','Todos'],['receber','A receber'],['recebidos','Recebidos'],['despesas','Despesas']];
  corpo.innerHTML = `
    <div class="indicadores ${animar ? '' : 'sem-entrada'}">${kpis.map((k, i) => `<div class="card ind entra ${k.cls || ''}" style="--i:${i}">
      <span class="ind-rot">${icone(k.ic)}${k.rot}</span>
      <span class="ind-val" data-contar="${k.val}" data-fmt="moeda">${moeda(k.val)}</span>
      <span class="ind-sub">${esc(k.sub)}</span></div>`).join('')}</div>
    <div class="fin-grade">
      <section class="card fin-bloco entra" style="--i:5">
        <h2>Andamento do mês</h2>
        ${receita ? `<div class="andamento" role="img" aria-label="Recebido ${Math.round(pc(recebido))}%, a receber ${Math.round(pc(aReceber - atrasado))}%, atrasado ${Math.round(pc(atrasado))}%">
          <span class="and-rec" style="width:${pc(recebido)}%"></span><span class="and-pend" style="width:${pc(aReceber - atrasado)}%"></span><span class="and-atr" style="width:${pc(atrasado)}%"></span>
        </div>
        <div class="legenda"><span><i style="background:var(--verde)"></i>Recebido<b>${moeda(recebido)}</b></span><span><i style="background:#E6B04A"></i>No prazo<b>${moeda(aReceber - atrasado)}</b></span><span><i style="background:var(--vermelho)"></i>Atrasado<b>${moeda(atrasado)}</b></span></div>`
        : '<p class="sub">Nenhuma receita lançada neste mês. Use "Gerar mensalidades" para criar as cobranças dos clientes ativos.</p>'}
        ${desp.length ? `<h3 class="fin-sub">Para onde foi o dinheiro</h3><div class="cats">${Object.entries(desp.reduce((m, p) => { const c = p.categoria || 'Outros'; m[c] = (m[c] || 0) + Number(p.valor); return m; }, {})).sort((a, b) => b[1] - a[1]).map(([c, v]) => `<div class="cat"><span>${esc(c)}</span><span class="cat-barra"><i style="width:${v / despesas * 100}%"></i></span><b>${moeda(v)}</b></div>`).join('')}</div>` : ''}
        ${antes ? `<p class="fin-aviso">${icone('info')}Há ainda ${moeda(antes)} em aberto de meses anteriores. Veja em "A receber".</p>` : ''}
      </section>
      <section class="card fin-bloco entra" style="--i:6">
        <h2>Últimos 6 meses</h2>
        <div class="grafico" role="img" aria-label="Recebido e despesas dos últimos 6 meses">${serie.map((x, i) => `<div class="g-mes ${i === 5 ? 'atual' : ''}" title="${mesCurto(x.m)}: recebido ${moeda(x.r)}, despesas ${moeda(x.d)}">
          <div class="g-barras"><span class="g-r" style="--h:${x.r / max * 100}%;--i:${i}"></span><span class="g-d" style="--h:${x.d / max * 100}%;--i:${i}"></span></div>
          <span class="g-rot">${mesCurto(x.m)}</span></div>`).join('')}</div>
        <div class="legenda"><span><i style="background:var(--verde)"></i>Recebido</span><span><i style="background:#C9CECC"></i>Despesas</span></div>
      </section>
    </div>
    <div class="fin-lista-cab entra" style="--i:7">
      <h2>Lançamentos de ${nomeMes(fin.ref).toLowerCase()}</h2>
      ${segmentadoVisoes('fin', fin.aba, abas)}
    </div>
    <div id="fin-lista">${htmlListaFin()}</div>`;
  posicionarIndicadores(corpo);
  if (animar) contarNumeros(corpo);
}

function htmlListaFin(){
  let lista;
  if (fin.aba === 'receber') lista = [...fin.anteriores.map(p => ({ ...p, _anterior:true })), ...fin.itens.filter(p => p.tipo === 'receita' && p.status === 'pendente')];
  else if (fin.aba === 'recebidos') lista = fin.itens.filter(p => p.tipo === 'receita' && p.status === 'recebido');
  else if (fin.aba === 'despesas') lista = fin.itens.filter(p => p.tipo === 'despesa');
  else lista = [...fin.itens];
  lista.sort((a, b) => a.vencimento.localeCompare(b.vencimento));
  if (!lista.length) return vazio('Nenhum lançamento aqui.', `<button class="btn btn-verde" data-acao="novo-lanc">${icone('mais')}Novo lançamento</button>`);
  return `<div class="linhas">${lista.map(linhaLanc).join('')}</div>`;
}
function linhaLanc(p, i){
  const c = clientePorId(p.cliente_id), desp = p.tipo === 'despesa', pago = p.status === 'recebido';
  const st = p.status === 'cancelado' ? ['Cancelado', ''] : pago ? [desp ? 'Pago' : 'Recebido', 'tom-verde'] : ehAtrasado(p) ? ['Atrasado', 'tom-vermelho'] : ['Pendente', 'tom-ambar'];
  const detalhes = [c?.nome || (desp ? (p.categoria || 'Despesa') : 'Sem cliente'), `vence ${dataCurta(p.vencimento)}`, MESES_REC[p.recorrencia] ? RECORRENCIA[p.recorrencia].toLowerCase() : '', p._anterior ? 'mês anterior' : ''].filter(Boolean).join(', ');
  return `<div class="recolhe" data-lanc-wrap="${esc(p.id)}"><div>
    <div class="linha fl entra" style="--i:${Math.min(i, 12)}" data-lanc="${esc(p.id)}" tabindex="0">
      ${c ? `<span class="avatar p" style="--cor:${esc(c.cor || '#0F766E')}">${iniciais(c.nome)}</span>` : `<span class="fl-ic ${desp ? 'desp' : ''}">${icone(desp ? 'saida' : 'entrada')}</span>`}
      <div class="linha-tit">${esc(p.servico || (desp ? 'Despesa' : 'Receita'))}<small>${esc(detalhes)}</small></div>
      <span class="pill ${st[1]}">${st[0]}</span>
      <span class="linha-valor ${desp ? 'neg' : ''}">${desp ? '− ' : ''}${moeda(p.valor, true)}</span>
      ${p.status === 'pendente' ? `<button class="btn-baixa" data-acao="baixar" data-id="${esc(p.id)}">${icone('check')}${desp ? 'Pago' : 'Recebido'}</button>` : '<span class="btn-baixa-vazio"></span>'}
    </div>
  </div></div>`;
}
const acharLanc = id => fin.itens.find(x => x.id === id) || fin.anteriores.find(x => x.id === id) || state.cli?.pagamentos.find(x => x.id === id);

async function baixar(id, botao){
  const p = acharLanc(id); if (!p) return;
  botao.classList.add('feito'); botao.disabled = true;
  try {
    const salvo = await api.update('pagamentos', id, { status:'recebido', recebido_em:dia(0) });
    [fin.itens, fin.anteriores, fin.historico, state.cli?.pagamentos || []].forEach(arr => arr.forEach(x => { if (x.id === id) Object.assign(x, salvo); }));
    let proxima = null;
    if (MESES_REC[p.recorrencia]){
      const venc = somarMeses(p.vencimento, MESES_REC[p.recorrencia]);
      const filtro = { eq:{ tipo:p.tipo, servico:p.servico, vencimento:venc } };
      if (p.cliente_id) filtro.eq.cliente_id = p.cliente_id; else filtro.nulo = ['cliente_id'];
      const existe = await api.list('pagamentos', filtro);
      if (!existe.length){
        proxima = await api.insert('pagamentos', { tipo:p.tipo, cliente_id:p.cliente_id || null, servico:p.servico, categoria:p.categoria || null, valor:p.valor, vencimento:venc, recorrencia:p.recorrencia, status:'pendente' });
        fin.historico.push(proxima);
        if (venc >= inicioMes(fin.ref) && venc <= fimMes(fin.ref)) fin.itens.push(proxima);
      }
    }
    avisar(`${p.tipo === 'despesa' ? 'Pago' : 'Recebido'}: ${moeda(p.valor)}.${proxima ? ` A próxima já ficou lançada para ${dataCurta(proxima.vencimento)}.` : ''}`);
    setTimeout(() => {
      if (state.rota.pagina === 'financeiro') renderFinanceiro(false);
      if (state.rota.pagina === 'cliente' && state.cli) trocarAba(state.cli.aba);
    }, reduzMovimento ? 0 : 450);
    atualizarBase();
  } catch (e){ botao.classList.remove('feito'); botao.disabled = false; avisar(msgErro(e)); }
}

async function gerarMensalidades(){
  const ini = inicioMes(fin.ref);
  const faltam = state.base.clientes.filter(c => c.status === 'ativo' && Number(c.valor_contrato) > 0 && !fin.itens.some(p => p.tipo === 'receita' && p.cliente_id === c.id));
  if (!faltam.length){ avisar('Todos os clientes ativos já têm cobrança neste mês.'); return; }
  if (!confirm(`Criar ${faltam.length} ${faltam.length === 1 ? 'mensalidade' : 'mensalidades'} em ${nomeMes(ini).toLowerCase()}?\n\n${faltam.map(c => `${c.nome}: ${moeda(c.valor_contrato)}`).join('\n')}`)) return;
  try {
    for (const c of faltam){
      const d = c.data_inicio ? Math.min(paraData(c.data_inicio).getDate(), 28) : 10;
      const p = await api.insert('pagamentos', { tipo:'receita', cliente_id:c.id, servico:c.servico || 'Mensalidade', valor:c.valor_contrato, vencimento:`${ini.slice(0, 8)}${pad(d)}`, recorrencia:'mensal', status:'pendente' });
      fin.historico.push(p); fin.itens.push(p);
    }
    renderFinanceiro(false);
    avisar(`${faltam.length} ${faltam.length === 1 ? 'mensalidade criada' : 'mensalidades criadas'}.`);
    atualizarBase();
  } catch (e){ avisar(msgErro(e)); }
}

function modalLanc(p, preset = {}){
  const e = p || { tipo:preset.tipo || 'receita', cliente_id:preset.cliente || state.cli?.cliente.id || '', vencimento:dia(0), recorrencia:'unico', status:'pendente' };
  state.editLanc = p?.id || null;
  abrirModal(`<form class="modal" id="form-lanc" role="dialog" aria-modal="true" aria-labelledby="mt">
    <h2 id="mt">${p ? 'Editar lançamento' : 'Novo lançamento'}</h2><p class="sub">Uma cobrança de cliente ou uma despesa da agência.</p>
    <div class="campos">
      <div class="campo largo"><label>Tipo</label><div class="formatos">${[['receita','Receita (entra)'],['despesa','Despesa (sai)']].map(([v, l]) => `<label><input type="radio" name="tipo" value="${v}" ${e.tipo === v ? 'checked' : ''}><span>${l}</span></label>`).join('')}</div></div>
      <div class="campo largo"><label for="fl-desc">Descrição</label><input id="fl-desc" name="servico" required value="${esc(e.servico || '')}" placeholder="Ex.: Gestão de redes sociais"></div>
      <div class="campo" data-so="receita"><label for="fl-cli">Cliente</label><select id="fl-cli" name="cliente_id"><option value="">Sem cliente</option>${opcoesClientes(e.cliente_id)}</select></div>
      <div class="campo" data-so="despesa"><label for="fl-cat">Categoria</label><select id="fl-cat" name="categoria">${CATEGORIAS_DESPESA.map(c => `<option ${e.categoria === c ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
      <div class="campo"><label for="fl-valor">Valor (R$)</label><input id="fl-valor" name="valor" type="number" step="0.01" min="0" inputmode="decimal" required value="${esc(e.valor ?? '')}" placeholder="0,00"></div>
      <div class="campo"><label for="fl-venc">Vencimento</label><input id="fl-venc" name="vencimento" type="date" required value="${esc(e.vencimento)}"></div>
      <div class="campo"><label for="fl-rec">Repetir</label><select id="fl-rec" name="recorrencia">${Object.entries(RECORRENCIA).map(([k, l]) => `<option value="${k}" ${e.recorrencia === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
      <div class="campo largo"><label class="alternar"><input type="checkbox" name="pago" ${e.status === 'recebido' ? 'checked' : ''}><span class="trilho"></span><span id="txt-pago">Já foi recebido</span></label></div>
    </div>
    <div class="modal-rodape">
      ${p ? `<button type="button" class="btn btn-fantasma btn-perigo" data-acao="excluir-lanc" style="margin-right:auto">${icone('lixo')}Excluir</button>` : ''}
      <button type="button" class="btn btn-fantasma" data-acao="fechar-modal">Cancelar</button>
      <button type="submit" class="btn btn-verde">${p ? 'Salvar' : 'Lançar'}</button>
    </div>
  </form>`);
  ajustarTipoLanc();
}
function ajustarTipoLanc(){
  const f = document.getElementById('form-lanc'); if (!f) return;
  const t = f.querySelector('[name=tipo]:checked').value;
  f.querySelectorAll('[data-so]').forEach(el => el.hidden = el.dataset.so !== t);
  document.getElementById('txt-pago').textContent = t === 'despesa' ? 'Já foi pago' : 'Já foi recebido';
}
async function salvarLanc(form){
  const d = Object.fromEntries(new FormData(form));
  const antigo = state.editLanc ? acharLanc(state.editLanc) : null;
  const obj = {
    tipo:d.tipo, servico:d.servico.trim(), valor:Number(d.valor), vencimento:d.vencimento, recorrencia:d.recorrencia,
    cliente_id:d.tipo === 'receita' ? (d.cliente_id || null) : null,
    categoria:d.tipo === 'despesa' ? d.categoria : null,
    status:d.pago ? 'recebido' : 'pendente',
    recebido_em:d.pago ? (antigo?.recebido_em || dia(0)) : null
  };
  const b = form.querySelector('[type=submit]'); b.disabled = true;
  try {
    const salvo = state.editLanc ? await api.update('pagamentos', state.editLanc, obj) : await api.insert('pagamentos', obj);
    const noMes = salvo.vencimento >= inicioMes(fin.ref) && salvo.vencimento <= fimMes(fin.ref);
    [fin.historico, fin.itens, fin.anteriores].forEach(arr => { const i = arr.findIndex(x => x.id === salvo.id); if (i >= 0) arr.splice(i, 1); });
    fin.historico.push(salvo); if (noMes) fin.itens.push(salvo);
    if (state.cli){
      state.cli.pagamentos = state.cli.pagamentos.filter(x => x.id !== salvo.id);
      if (salvo.tipo === 'receita' && salvo.cliente_id === state.cli.cliente.id) state.cli.pagamentos.unshift(salvo);
    }
    fecharModal();
    if (state.rota.pagina === 'financeiro') renderFinanceiro(false);
    if (state.rota.pagina === 'cliente' && state.cli) trocarAba(state.cli.aba);
    avisar(state.editLanc ? 'Lançamento salvo.' : `${salvo.tipo === 'despesa' ? 'Despesa' : 'Receita'} de ${moeda(salvo.valor)} lançada.`);
    atualizarBase();
  } catch (e){ avisar(msgErro(e)); b.disabled = false; }
}
async function excluirLanc(){
  const id = state.editLanc; if (!id) return;
  if (!confirm('Excluir este lançamento?')) return;
  try {
    await api.remove('pagamentos', id);
    [fin.historico, fin.itens, fin.anteriores].forEach(arr => { const i = arr.findIndex(x => x.id === id); if (i >= 0) arr.splice(i, 1); });
    if (state.cli) state.cli.pagamentos = state.cli.pagamentos.filter(x => x.id !== id);
    fecharModal();
    if (state.rota.pagina === 'financeiro') renderFinanceiro(false);
    if (state.rota.pagina === 'cliente' && state.cli) trocarAba(state.cli.aba);
    avisar('Lançamento excluído.'); atualizarBase();
  } catch (e){ avisar(msgErro(e)); }
}

const ent = { tipo:'tudo', cliente:'todos', dados:null };
const GRUPOS_ENT = [['atrasadas','Atrasadas'],['hoje','Hoje'],['amanha','Amanhã'],['semana','Nos próximos 7 dias'],['depois','Mais para frente'],['sem','Sem prazo']];
const STATUS_A_ENTREGAR = ['ideia','planejado','em_criacao','revisao_interna','alteracao_solicitada'];

function paginaEntregas(){
  return `
    <div class="cab-pagina">
      <div class="entra"><h1>Entregas</h1><p class="sub">Tudo o que precisa sair da agência, em ordem de prazo.</p></div>
      <div class="cab-acoes entra" style="--i:1">${segmentadoVisoes('ent', ent.tipo, [['tudo','Tudo'],['conteudo','Conteúdos'],['projeto','Projetos'],['tarefa','Tarefas']])}</div>
    </div>
    <div class="barra-ferr entra" style="--i:2" id="ent-ferr">${chipsClientes('ent', ent.cliente)}</div>
    <div id="ent-corpo"><div class="ent-stats">${'<div class="esq" style="height:84px;border-radius:18px"></div>'.repeat(4)}</div></div>`;
}
async function carregarEntregas(){
  const [conts, projs, tars] = await Promise.all([
    api.list('conteudos', { in:{ status:STATUS_A_ENTREGAR }, order:'prazo', limit:400 }),
    api.list('projetos', { in:{ etapa:ETAPAS.map(e => e[0]).filter(e => e !== 'entregue') }, order:'prazo', limit:200 }),
    api.list('tarefas', { eq:{ feita:false }, order:'prazo', limit:400 })
  ]);
  ent.dados = { conts:conts.filter(k => k.status !== 'ideia' || k.prazo || k.data_publicacao), projs, tars };
}
function itensEntregas(){
  if (!ent.dados) return [];
  const { conts, projs, tars } = ent.dados, it = [];
  conts.forEach(k => it.push({ tipo:'conteudo', id:k.id, titulo:`#${k.numero} ${k.titulo}`, cliente_id:k.cliente_id, prazo:k.prazo || k.data_publicacao, etapa:STATUS_CONTEUDO[k.status], tom:TOM_CONTEUDO[k.status] || '', sub:k.formato }));
  projs.forEach(p => it.push({ tipo:'projeto', id:p.id, titulo:p.nome, cliente_id:p.cliente_id, prazo:p.prazo, etapa:rotuloEtapa(p.etapa), tom:'tom-azul', sub:'Projeto' }));
  tars.forEach(t => it.push({ tipo:'tarefa', id:t.id, titulo:t.titulo, cliente_id:t.cliente_id, prazo:t.prazo, etapa:t.origem === 'onboarding' ? 'Onboarding' : t.origem === 'processo' ? 'Processo' : 'Tarefa', tom:'', sub:'Tarefa' }));
  return it.filter(x => (ent.tipo === 'tudo' || x.tipo === ent.tipo) && (ent.cliente === 'todos' || x.cliente_id === ent.cliente) && (!x.cliente_id || clientePorId(x.cliente_id)));
}
const grupoEnt = pz => { if (!pz) return 'sem'; const d = diffDias(pz); return d < 0 ? 'atrasadas' : d === 0 ? 'hoje' : d === 1 ? 'amanha' : d <= 7 ? 'semana' : 'depois'; };

function renderEntregas(){
  const corpo = document.getElementById('ent-corpo'); if (!corpo) return;
  document.getElementById('ent-ferr').innerHTML = chipsClientes('ent', ent.cliente);
  const it = itensEntregas(), grupos = {};
  it.forEach(x => (grupos[grupoEnt(x.prazo)] ||= []).push(x));
  Object.values(grupos).forEach(g => g.sort((a, b) => (a.prazo || '').localeCompare(b.prazo || '')));
  const n = g => (grupos[g] || []).length;
  const stats = [['Atrasadas', n('atrasadas'), n('atrasadas') ? 'alerta' : ''], ['Hoje', n('hoje'), ''], ['Próximos 7 dias', n('amanha') + n('semana'), ''], ['Mais para frente', n('depois'), '']];
  const icones = { conteudo:'conteudos', projeto:'projetos', tarefa:'tarefa' };
  let i = 0;
  corpo.innerHTML = `
    <div class="ent-stats">${stats.map(([l, v, c], j) => `<div class="card ent-stat entra ${c}" style="--i:${j}"><b>${v}</b><span>${l}</span></div>`).join('')}</div>
    ${it.length ? GRUPOS_ENT.filter(([g]) => n(g)).map(([g, l]) => `<section class="ent-grupo">
      <h2 class="entra ${g === 'atrasadas' ? 'alerta' : ''}">${l}<span>${n(g)}</span></h2>
      <div class="linhas">${grupos[g].map(x => { const c = clientePorId(x.cliente_id); const atr = g === 'atrasadas'; return `<div class="recolhe" data-ent-wrap="${x.tipo}-${esc(x.id)}"><div>
        <div class="linha ent-linha entra" style="--i:${Math.min(i++, 14)}" data-ent="${x.tipo}" data-id="${esc(x.id)}" tabindex="0">
          <span class="ent-ic ent-${x.tipo}">${icone(icones[x.tipo])}</span>
          <div class="linha-tit">${esc(x.titulo)}<small>${esc([c?.nome || 'Interno', x.sub].filter(Boolean).join(', '))}</small></div>
          <span class="pill ${x.tom}">${esc(x.etapa)}</span>
          <span class="linha-data ${atr ? 'txt-alerta' : ''}">${x.prazo ? rotuloDia(x.prazo) : 'Sem prazo'}</span>
          ${x.tipo === 'tarefa' ? `<button class="btn-baixa" data-acao="concluir-tarefa" data-id="${esc(x.id)}">${icone('check')}Concluir</button>` : '<span class="btn-baixa-vazio"></span>'}
        </div></div></div>`; }).join('')}</div>
    </section>`).join('') : `<div class="card tudo-certo entra"><div class="selo-ok">${icone('check')}</div><h2>Nada para entregar</h2><p>Tudo em dia por aqui.</p></div>`}`;
}
async function concluirTarefa(id, botao){
  const wrap = document.querySelector(`[data-ent-wrap="tarefa-${CSS.escape(id)}"]`);
  botao.classList.add('feito'); botao.disabled = true;
  try {
    await api.update('tarefas', id, { feita:true });
    ent.dados.tars = ent.dados.tars.filter(t => t.id !== id);
    if (state.cli){ const t = state.cli.tarefas.find(x => x.id === id); if (t) t.feita = true; }
    setTimeout(() => wrap?.classList.add('saindo'), 250);
    setTimeout(() => renderEntregas(), reduzMovimento ? 0 : 700);
    avisar('Tarefa concluída.');
  } catch (e){ botao.classList.remove('feito'); botao.disabled = false; avisar(msgErro(e)); }
}

const TIPOS_BIB = { modelo:'Modelos', referencia:'Referências', processo:'Processos' };
const bib = { aba:'modelo', busca:'', itens:[] };
const etapasDe = item => String(item.conteudo || '').split('\n').map(x => x.trim()).filter(Boolean);

function paginaBiblioteca(){
  return `
    <div class="cab-pagina">
      <div class="entra"><h1>Biblioteca</h1><p class="sub">Modelos de texto, referências e processos da agência, prontos para reaproveitar.</p></div>

    </div>
    <div id="bib-corpo"><div class="bib-grade">${'<div class="esq" style="height:220px;border-radius:20px"></div>'.repeat(3)}</div></div>`;

function renderBiblioteca(){
  const corpo = document.getElementById('bib-corpo'); if (!corpo) return;
  const q = normalizar(bib.busca.trim());
  const lista = bib.itens.filter(x => x.tipo === bib.aba && (!q || normalizar([x.titulo, x.categoria, x.conteudo].join(' ')).includes(q)));
  if (!lista.length){
    corpo.innerHTML = vazio(q ? 'Nada encontrado com essa busca.' : `Nenhum item em ${TIPOS_BIB[bib.aba].toLowerCase()} ainda.`, `<button class="btn btn-verde" data-acao="novo-bib">${icone('mais')}Novo item</button>`);

async function salvarBib(form){

  try {

    const i = bib.itens.findIndex(x => x.id === salvo.id);
    if (i >= 0) bib.itens[i] = salvo; else bib.itens.push(salvo);
    fecharModal();
    if (bib.aba !== salvo.tipo){ bib.aba = salvo.tipo; trocarSegmento('bib', bib.aba); }

async function excluirBib(){

}
async function copiarBib(id){
  const x = bib.itens.find(i => i.id === id); if (!x) return;
  try { await navigator.clipboard.writeText(x.conteudo || ''); avisar('Texto copiado. É só colar.'); }

}
